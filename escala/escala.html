<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Kyro - Gestão de Escala</title>
    <link rel="shortcut icon" href="../imagens/favicon.ico" type="image/x-icon">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Outfit"', 'sans-serif'] },
                    colors: {
                        navy: {
                            700: '#334155',
                            800: '#1e293b', 
                            900: '#0f172a', // Azul escuro profundo
                            950: '#020617', // Quase preto/azul
                        },
                        crimson: {
                            500: '#ef4444',
                            600: '#dc2626', // Vermelho principal
                            700: '#b91c1c',
                            glow: 'rgba(220, 38, 38, 0.4)',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Estilos Globais Surreais / Clean White + Deep Blue + Crimson */
        :root {
            --table-font-size: min(1.6vh, 0.75vw); 
            --table-line-height: 1.1;
            --table-cell-padding: 0.2vh;
        }

        body { 
            background-color: #ffffff; 
            color: #0f172a; 
            font-size: 0.9rem; 
            overflow: hidden; 
            background-image: radial-gradient(#0f172a 0.5px, transparent 0.5px);
            background-size: 32px 32px;
            background-position: -19px -19px;
        } 
        
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 0px; }
        ::-webkit-scrollbar-thumb:hover { background: #dc2626; }

        /* Formas Surreais */
        .shard-panel {
            background: #ffffff;
            border-right: 1px solid rgba(15, 23, 42, 0.1);
            border-left: 1px solid rgba(15, 23, 42, 0.1);
            position: relative;
        }

        .shard-panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(15,23,42,0.02) 0%, transparent 100%);
            pointer-events: none;
            z-index: 0;
        }

        /* Tabela Matriz (Branco, Azul Escuro, Vermelho) */
        .modern-table { 
            width: 100%; 
            height: 100%; 
            border-collapse: collapse; 
            font-size: var(--table-font-size);
            line-height: var(--table-line-height);
            table-layout: fixed; 
            background: #ffffff;
            position: relative;
            z-index: 10;
        }
        .modern-table th { 
            background: #0f172a; 
            color: #ffffff; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 0.05em; 
            padding: 4px 2px; 
            border-bottom: 2px solid #dc2626; 
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            height: 3vh; 
            user-select: none;
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 4px), calc(100% - 4px) 100%, 0 100%);
        }
        .modern-table td { 
            border-bottom: 1px solid rgba(15, 23, 42, 0.1); 
            border-right: 1px solid rgba(15, 23, 42, 0.1);
            padding: 0 2px; 
            text-align: center; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis;
            height: 1px; 
            cursor: pointer;
            transition: all 0.2s ease;
            color: #1e293b;
            font-weight: 500;
        }

        /* Estados de Célula Translúcidos/Neon */
        .editable:hover { 
            background-color: rgba(220, 38, 38, 0.05) !important; 
            color: #dc2626; 
            font-weight: 700; 
            box-shadow: inset 0 0 0 1px #dc2626;
        }
        .cursor-troca .editable { cursor: alias !important; }
        
        .celula-troca-origem { 
            background-color: #0f172a !important; 
            border: 1px solid #dc2626 !important; 
            color: #ffffff !important;
            font-weight: bold;
        }
        
        .celula-travada { 
            background-color: rgba(15, 23, 42, 0.03) !important; 
            color: #94a3b8; 
            font-weight: 400;
        }
        
        .dia-hoje { 
            background-color: rgba(15, 23, 42, 0.02) !important; 
            border-left: 3px solid #dc2626; 
        }
        
        /* Mapeamento de Cores de Estrutura */
        .bg-custom-gray { background-color: rgba(15, 23, 42, 0.03) !important; } 
        .bg-custom-gray-header { background-color: #1e293b !important; color: #ffffff !important; }
        .bg-custom-gray-group { background-color: #020617 !important; color: #ffffff !important; border-bottom: 1px solid #334155 !important;}

        .sync-active { background-color: rgba(220, 38, 38, 0.1); border-color: #dc2626; transition: all 1.5s; }

        /* Drag and Drop - Data Shards */
        .draggable-item { cursor: grab; }
        .draggable-item:active { cursor: grabbing; }
        .drag-over { border: 1px dashed #dc2626 !important; background-color: rgba(220, 38, 38, 0.05) !important; }
        .dragging { opacity: 0.3; border: 1px dashed #dc2626; filter: grayscale(1); }
        .drop-target-group { transition: all 0.2s; clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); }
        .drop-target-group.drag-over { border-color: #dc2626 !important; box-shadow: 0 0 15px rgba(220, 38, 38, 0.2); }

        /* Layout Dinâmico */
        .dashboard-container {
            display: flex;
            height: calc(100vh - 55px);
            overflow: hidden;
            gap: 0px;
            padding: 0px;
            border-top: 2px solid #0f172a;
        }

        .sidebar-left, .sidebar-right {
            transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
            flex-shrink: 0;
            background: #ffffff;
            z-index: 20;
        }
        
        .sidebar-left { width: 300px; } 
        .sidebar-right { width: 280px; }
        
        .sidebar-left.collapsed { width: 0; border-width: 0; }
        .sidebar-right.collapsed { width: 0; border-width: 0; }

        .main-panel {
            flex: 1; min-width: 0; display: flex; flex-direction: column;
            background: #ffffff; height: 100%; position: relative; z-index: 10;
        }

        .panel { display: flex; flex-direction: column; overflow: hidden; height: 100%; }
        .panel-header { 
            padding: 10px 16px; 
            border-bottom: 2px solid #0f172a; 
            background: #ffffff; 
            display: flex; justify-content: space-between; align-items: center; min-height: 44px; 
            position: relative;
            z-index: 20;
        }
        .panel-content { padding: 0; overflow-y: auto; flex: 1; position: relative; z-index: 10;}
        
        /* Botões Surreais (Angular/Hex) */
        .btn { 
            display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; 
            font-weight: 700; font-size: 0.75rem; 
            cursor: pointer; transition: all 0.2s;
            text-transform: uppercase; letter-spacing: 0.05em; font-family: 'Outfit', sans-serif;
            clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
        }
        .btn-sm { padding: 4px 10px; font-size: 0.7rem; clip-path: polygon(4px 0, 100% 0, 100% calc(100% - 4px), calc(100% - 4px) 100%, 0 100%, 0 4px);}
        
        .btn-primary { 
            background: #0f172a; 
            color: #ffffff; 
            border: none;
        }
        .btn-primary:hover { 
            background: #dc2626; 
        }
        
        .btn-secondary { 
            background: #f8fafc; 
            color: #0f172a; 
            border: 1px solid #e2e8f0; 
        }
        .btn-secondary:hover { 
            background: #e2e8f0; 
            border-color: #0f172a;
        }
        
        .btn-active { 
            background: #dc2626; 
            color: #ffffff; 
            border-color: #dc2626; 
        }
        
        .editor-btn { width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; color: #64748b; cursor: pointer; border: 1px solid transparent; clip-path: polygon(4px 0, 100% 0, 100% calc(100% - 4px), calc(100% - 4px) 100%, 0 100%, 0 4px);}
        .editor-btn:hover { background-color: #f1f5f9; color: #0f172a; border-color: #cbd5e1; }
        
        .valign-top { justify-content: flex-start; }
        .valign-middle { justify-content: center; }
        .valign-bottom { justify-content: flex-end; }
        
        /* Modais */
        .modal-backdrop { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(5px); }
        .modal-content {
            background: #ffffff;
            border: 2px solid #0f172a;
            box-shadow: 20px 20px 0px rgba(15, 23, 42, 0.1);
            clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
        }

        .input-std { 
            width: 100%; padding: 8px 10px; 
            border: 1px solid #cbd5e1; 
            font-size: 0.75rem; 
            background: #f8fafc; 
            color: #0f172a;
            outline: none; transition: all 0.2s;
            clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
        }
        .input-std:focus { border-color: #0f172a; background: #ffffff; box-shadow: 4px 4px 0 rgba(15,23,42,0.05);}
        
        .toggle-sidebar-btn {
            width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
            color: #64748b; cursor: pointer; border: 1px solid transparent;
            clip-path: polygon(4px 0, 100% 0, 100% calc(100% - 4px), calc(100% - 4px) 100%, 0 100%, 0 4px);
        }
        .toggle-sidebar-btn:hover { background: #0f172a; color: #ffffff; }
        
        /* Resumo Flat -> Surreal */
        .resumo-table-container { overflow-x: auto; background: #ffffff; }
        .resumo-table { border-collapse: collapse; font-size: 10px; width: auto; min-width: 100%; }
        .resumo-table th, .resumo-table td { padding: 6px 8px; border-bottom: 1px solid #e2e8f0; border-right: 1px solid #e2e8f0; white-space: nowrap; text-align: center; }
        .resumo-col-nome {
            position: sticky; left: 0; background: #ffffff; z-index: 10;
            border-right: 2px solid #0f172a; text-align: left; width: 120px;
            min-width: 120px; max-width: 120px; overflow: hidden; text-overflow: ellipsis;
            color: #0f172a;
            font-weight: 700;
        }
        .resumo-table thead .resumo-col-nome { background: #0f172a; border-bottom: 2px solid #dc2626; color: #ffffff;}
        .resumo-table thead th { border-bottom: 2px solid #dc2626; background: #0f172a; color: #ffffff; font-weight: 700;}
        .resumo-table tbody tr:hover { background-color: #f8fafc; }
        .resumo-table tbody tr:hover .resumo-col-nome { background-color: #f8fafc; }

        #editor-obs {
            background: #ffffff;
            color: #0f172a;
        }

        /* Custom Drag Icon */
        .drag-handle {
            cursor: grab;
            color: #94a3b8;
        }
        .drag-handle:active {
            cursor: grabbing;
        }

        @media (max-width: 900px) {
            #mes-select, #ano-input { font-size: 0.75rem; }
            .btn { padding: 6px 10px; }
        }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden selection:bg-crimson-600 selection:text-white">

    <!-- HEADER SURREAL -->
    <header class="bg-navy-900 h-[55px] flex-shrink-0 z-30 px-6 flex items-center justify-between border-b-4 border-crimson-600 shadow-lg">
        <div class="flex items-center gap-4">
            <!-- Logo Surreal -->
            <div class="w-8 h-8 relative flex items-center justify-center">
                <img src="../imagens/logo.png" alt="logo">
            </div>
            <div class="leading-tight">
                <div class="flex items-center gap-3">
                    <h1 class="text-sm font-bold text-white tracking-wide uppercase">Kyro</h1>
                </div>
                <p class="text-[10px] text-gray-400 font-mono tracking-widest uppercase mt-0.5">Gestão de Escalonamento</p>
            </div>
        </div>
        
        <div class="flex items-center gap-1 bg-navy-950 p-1 border border-navy-800" style="clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);">
            <button onclick="toggleSidebar('left')" class="toggle-sidebar-btn hover:bg-navy-800 text-gray-400 hover:text-white" title="Alternar Painel Esquerdo" id="btn-toggle-left">
                <i class="fas fa-columns text-sm"></i>
            </button>
            <div class="h-4 w-px bg-navy-700 mx-1"></div>
            <button onclick="toggleSidebar('right')" class="toggle-sidebar-btn hover:bg-navy-800 text-gray-400 hover:text-white" title="Alternar Painel Direito" id="btn-toggle-right">
                <i class="fas fa-microchip text-sm"></i>
            </button>
        </div>

        <div class="flex items-center gap-3">
            <button onclick="abrirModalMestre()" class="btn btn-primary btn-sm group bg-white text-navy-900 hover:bg-gray-200">
                <i class="fas fa-database text-crimson-600"></i> <span class="hidden md:inline font-bold tracking-wider">Mestre</span>
            </button>
            
            <div class="h-4 w-px bg-navy-700 hidden sm:block"></div>

            <button onclick="exportarBackupMestre()" class="btn btn-secondary btn-sm group bg-navy-800 text-white border-navy-700 hover:bg-navy-700" title="Salvar Backup dos Funcionários">
                <i class="fas fa-download text-gray-400 group-hover:text-white transition-colors"></i> <span class="hidden md:inline font-semibold">Backup</span>
            </button>

            <label class="btn btn-secondary btn-sm cursor-pointer group bg-navy-800 text-white border-navy-700 hover:bg-navy-700" title="Restaurar Backup de Funcionários">
                <i class="fas fa-upload text-gray-400 group-hover:text-white transition-colors"></i> <span class="hidden md:inline font-semibold">Restaurar</span>
                <input type="file" id="input-importar" class="hidden" accept=".json">
            </label>
        </div>
    </header>

    <div class="dashboard-container relative" id="dashboard-container">
        
        <!-- SIDEBAR ESQUERDA (RESUMO) -->
        <aside class="sidebar-left panel shard-panel" id="sidebar-left">
            <div class="panel-header border-b-2 border-navy-900">
                <span class="font-bold text-navy-900 text-[10px] tracking-widest font-mono uppercase"><i class="fas fa-chart-pie text-crimson-600 mr-2"></i>Data Overview</span>
                <span class="text-[9px] bg-navy-900 text-white px-2 py-1 font-mono font-bold tracking-wider" style="clip-path: polygon(4px 0, 100% 0, 100% calc(100% - 4px), calc(100% - 4px) 100%, 0 100%, 0 4px);" id="total-dias-badge">0 DIAS</span>
            </div>
            <div class="panel-content resumo-table-container custom-scrollbar">
                <table class="resumo-table">
                    <thead class="text-[9px] sticky top-0 z-20">
                        <tr id="resumo-header">
                            </tr>
                    </thead>
                    <tbody id="lista-resumo" class="text-[10px]">
                        </tbody>
                </table>
            </div>
        </aside>

        <!-- PAINEL CENTRAL (TABELA) -->
        <main class="main-panel relative flex flex-col" id="painel-central">
            <div class="panel-header flex-wrap gap-3 py-2 flex-shrink-0 bg-white border-b border-gray-200">
                
                <!-- Controle de Mês Angular -->
                <div class="flex items-center bg-gray-50 border border-gray-200 p-0.5 shadow-inner" style="clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);">
                    <button id="prev-month" class="w-7 h-7 flex items-center justify-center hover:bg-gray-200 text-gray-500 hover:text-navy-900 transition-colors"><i class="fas fa-chevron-left text-xs"></i></button>
                    <div class="flex flex-col items-center px-3">
                        <select id="mes-select" class="text-xs font-black bg-transparent border-none cursor-pointer text-center p-0 outline-none text-navy-900 uppercase tracking-widest font-mono">
                            <option value="0">JAN</option><option value="1">FEV</option><option value="2">MAR</option>
                            <option value="3">ABR</option><option value="4">MAI</option><option value="5">JUN</option>
                            <option value="6">JUL</option><option value="7">AGO</option><option value="8">SET</option>
                            <option value="9">OUT</option><option value="10">NOV</option><option value="11">DEZ</option>
                        </select>
                        <input type="number" id="ano-input" class="text-[10px] text-crimson-600 bg-transparent border-none w-10 text-center p-0 outline-none font-mono font-bold" value="2024">
                    </div>
                    <button id="next-month" class="w-7 h-7 flex items-center justify-center hover:bg-gray-200 text-gray-500 hover:text-navy-900 transition-colors"><i class="fas fa-chevron-right text-xs"></i></button>
                </div>

                <div class="h-6 w-px bg-gray-200 mx-1 hidden sm:block"></div>

                <button id="gerar-escala-btn" class="btn btn-primary"><i class="fas fa-bolt text-crimson-500"></i> <span class="hidden lg:inline">Gerar Matriz</span></button>
                <button id="embaralhar-btn" class="btn btn-secondary" title="Gerar Aleatório"><i class="fas fa-random text-navy-900"></i></button>
                <button id="btn-troca-rapida" class="btn btn-secondary" title="Modo Troca Rápida"><i class="fas fa-exchange-alt text-navy-900"></i></button>

                <div class="flex-1"></div>

                <!-- Botão Exportar -->
                <div class="relative">
                    <button id="btn-export-toggle" class="btn btn-secondary font-bold">Exportar <i class="fas fa-chevron-down text-[10px] ml-1"></i></button>
                    <div id="export-menu" class="absolute right-0 mt-2 w-32 bg-white border-2 border-navy-900 shadow-[8px_8px_0px_rgba(15,23,42,0.1)] hidden z-50 py-1" style="clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);">
                        <button onclick="exportarExcelOriginal()" class="w-full text-left px-3 py-2 text-xs hover:bg-gray-50 text-navy-900 flex items-center gap-2 font-bold transition-colors"><i class="fas fa-file-excel text-green-600"></i> Excel</button>
                        <button onclick="exportarPDFOriginal()" class="w-full text-left px-3 py-2 text-xs hover:bg-gray-50 text-navy-900 flex items-center gap-2 font-bold transition-colors"><i class="fas fa-file-pdf text-red-600"></i> PDF</button>
                    </div>
                </div>
            </div>

            <!-- TABELA PRINCIPAL -->
            <div class="flex-1 overflow-hidden relative flex flex-col">
                <table class="modern-table" id="tabela-principal">
                    <thead id="tabela-head"></thead>
                    <tbody id="tabela-escala"></tbody>
                </table>
            </div>

            <!-- EDITOR DE OBSERVAÇÕES -->
            <div class="bg-white border-t-2 border-navy-900 flex-shrink-0 flex flex-col relative z-20" style="height: 12vh; min-height: 60px; max-height: 120px;">
                <div class="px-3 py-1.5 flex items-center justify-between border-b border-gray-200 bg-gray-50">
                    <div class="flex items-center gap-1">
                        <button onclick="execCmd('bold')" class="editor-btn" title="Negrito"><i class="fas fa-bold text-[10px]"></i></button>
                        <button onclick="execCmd('italic')" class="editor-btn" title="Itálico"><i class="fas fa-italic text-[10px]"></i></button>
                        <button onclick="execCmd('underline')" class="editor-btn" title="Sublinhado"><i class="fas fa-underline text-[10px]"></i></button>
                        <div class="h-4 w-px bg-gray-300 mx-2 hidden sm:block"></div>
                        <button onclick="execCmd('justifyLeft')" class="editor-btn hidden sm:flex" title="Esquerda"><i class="fas fa-align-left text-[10px]"></i></button>
                        <button onclick="execCmd('justifyCenter')" class="editor-btn hidden sm:flex" title="Centro"><i class="fas fa-align-center text-[10px]"></i></button>
                        <button onclick="execCmd('justifyRight')" class="editor-btn hidden sm:flex" title="Direita"><i class="fas fa-align-right text-[10px]"></i></button>
                        <div class="h-4 w-px bg-gray-300 mx-2 hidden sm:block"></div>
                        <button onclick="setVerticalAlign('top')" class="editor-btn" title="Topo"><i class="fas fa-arrow-up text-[10px]"></i></button>
                        <button onclick="setVerticalAlign('middle')" class="editor-btn" title="Meio"><i class="fas fa-arrows-alt-v text-[10px]"></i></button>
                        <button onclick="setVerticalAlign('bottom')" class="editor-btn" title="Base"><i class="fas fa-arrow-down text-[10px]"></i></button>
                    </div>
                    <div class="flex items-center gap-3">
                        <input type="color" onchange="execCmd('foreColor', this.value)" class="w-4 h-4 p-0 border-0 bg-transparent cursor-pointer" title="Cor Texto">
                        <input type="color" onchange="execCmd('hiliteColor', this.value)" value="#ffffff" class="w-4 h-4 p-0 border-0 bg-transparent cursor-pointer" title="Cor Fundo">
                    </div>
                </div>
                <div id="editor-obs" 
                     class="flex-1 p-3 text-xs focus:outline-none overflow-y-auto flex flex-col font-mono font-medium" 
                     contenteditable="true">
                </div>
            </div>
        </main>

        <!-- SIDEBAR DIREITA (ESTRUTURA) -->
        <aside class="sidebar-right panel shard-panel" id="sidebar-right">
            
            <!-- MODELOS -->
            <div class="flex-shrink-0 border-b-2 border-navy-900 bg-gray-50">
                <div class="panel-header cursor-pointer hover:bg-gray-100 transition-colors bg-transparent border-none" onclick="toggleSection('sec-modelos')">
                    <span class="font-bold text-navy-900 text-[10px] tracking-widest font-mono uppercase"><i class="fas fa-layer-group text-crimson-600 mr-2"></i>Presets</span>
                    <i class="fas fa-chevron-down text-gray-500 text-[10px]"></i>
                </div>
                <div id="sec-modelos" class="p-4 space-y-3 hidden">
                    <div class="flex gap-2">
                        <input type="text" id="novo-modelo-nome" class="input-std flex-1 font-mono text-[10px] font-bold" placeholder="Nome do Preset...">
                        <button onclick="salvarModelo()" class="btn btn-primary text-[10px]">Save</button>
                    </div>
                    <div class="pt-2 border-t border-gray-200">
                        <div id="lista-modelos" class="space-y-1 max-h-24 overflow-y-auto custom-scrollbar"></div>
                    </div>
                </div>
            </div>

            <!-- FERRAMENTAS RÁPIDAS -->
            <div class="p-4 border-b-2 border-navy-900 bg-white">

                    <span class="font-bold text-navy-900 text-[10px] tracking-widest font-mono uppercase"><i class="fas fa-network-wired text-crimson-600 mr-2"></i>Data Structure</span>
                    <i class="fas fa-chevron-down text-gray-500 text-[10px]"></i>

                    <button onclick="adicionarGrupo()" class="w-full btn btn-secondary border-dashed border-gray-300 justify-center text-navy-900 hover:text-crimson-600 hover:border-crimson-600 font-mono font-bold text-[10px] tracking-wider py-2 transition-all mt-4" style="background: transparent;">

    <!-- MODAL EDIÇÃO -->

                        <div class="border border-gray-200 bg-white overflow-hidden" style="clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);">
                            <table class="w-full text-sm text-left border-collapse">
                                <thead class="bg-navy-900 text-white font-mono text-xs">
                                    <tr><th class="p-2 font-semibold">ENTIDADE</th><th class="p-2 font-semibold">INÍCIO</th><th class="p-2 font-semibold">FIM</th></tr>

                            <table class="w-full text-sm text-left border-collapse">
                                <thead class="bg-navy-900 text-white font-mono text-xs">
                                    <tr><th class="p-2 font-semibold">TIMESTAMP</th><th class="p-2 font-semibold">DESCRIÇÃO</th></tr>

    <script>
        // --- ESTADO (MANTIDO INTACTO) ---
        const MASTER_DB_KEY = 'limeira_dados_integrados_v6';
        const CONFIG_DB_KEY = 'escala_config_v23';
        const MODELS_DB_KEY = 'escala_modelos_v1';
        const DEFAULT_MOCK = { funcionarios: [], ferias: [], feriados: [] };
        const DEFAULT_OBS_TEXT = '<div style="text-align: center;"><b>Obs.: A escala poderá sofrer alterações.</b></div><div style="text-align: center;"><b>Na abertura dos guichês, 1° e 2° suplentes, permanecerão atendendo até às 09:30 ou a fila zerar.</b></div>';

        const DEFAULT_STRUCTURE = [
            {
                title: "", grayTitle: false,
                cols: [
                    { key: 'dataLabel', label: 'DIAS', type: 'system', grayHeader: false, grayBody: false },
                    { key: 'semLabel', label: 'DIAS SEM.', type: 'system', grayHeader: false, grayBody: false },
                    { key: 'senha', label: 'SENHA', type: 'system', grayHeader: false, grayBody: false }
                ]
            },
            {
                title: "", grayTitle: false,
                cols: [
                    { key: 'fixo1', label: 'FIXO 1', type: 'fixo', grayHeader: true, grayBody: false },
                    { key: 'fixo2', label: 'FIXO 2', type: 'fixo', grayHeader: true, grayBody: false },
                    { key: 'fixo3', label: 'FIXO 3', type: 'fixo', grayHeader: true, grayBody: false }
                ]
            },
            {
                title: "10 SENHAS OU 15 MIN / ALMOÇO", grayTitle: false,
                cols: [
                    { key: 'sup1', label: '1° SUPLENTE', type: 'suplente', grayHeader: true, grayBody: false },
                    { key: 'sup2', label: '2° SUPLENTE', type: 'suplente', grayHeader: true, grayBody: false }
                ]
            },
            {
                title: "15 SENHAS OU 20 MIN E ALMOÇO", grayTitle: false,
                cols: [
                    { key: 'sup3', label: '3° SUPLENTE', type: 'suplente', grayHeader: false, grayBody: false },
                    { key: 'sup4', label: '4° SUPLENTE', type: 'suplente', grayHeader: false, grayBody: false }
                ]
            },
            {
                title: "ACIMA 20 MINUTOS, ALMOÇO, QUANDO NECESSÁRIO", grayTitle: false,
                cols: [
                    { key: 'sup5', label: '5° SUPLENTE', type: 'suplente', grayHeader: false, grayBody: true },
                    { key: 'sup6', label: '6° SUPLENTE', type: 'suplente', grayHeader: false, grayBody: true }
                ]
            }
        ];

        let masterData = { funcionarios: [], ferias: [], feriados: [] };
        let appState = {
            escala: [], regrasFixas: [], destaques: {}, 
            structure: JSON.parse(JSON.stringify(DEFAULT_STRUCTURE)), 
            mes: new Date().getMonth(), ano: new Date().getFullYear(),
            observacoes: {}, observacoesConfig: {},
            ui: { leftPanel: true, rightPanel: true },
            models: []
        };
        
        let editando = null;
        let modoTrocaRapida = false;
        let trocaOrigem = null;

        // --- INIT ---
        document.addEventListener('DOMContentLoaded', () => {
            carregarDados();
            setupEvents();
            atualizarUI();
            carregarObservacaoAtual();
            aplicarEstadoUI();
            checkResponsive();
            window.addEventListener('resize', checkResponsive);
            if(masterData.funcionarios.length > 0) {
                 const el = document.getElementById('sync-indicator');
                 el.classList.remove('hidden'); el.classList.add('flex');
            }
        });

        window.addEventListener('storage', function(e) {
            if (e.key === MASTER_DB_KEY) {
                const el = document.getElementById('sync-indicator');
                el.classList.remove('hidden'); el.classList.add('flex', 'sync-active');
                setTimeout(() => el.classList.remove('sync-active'), 1500);
                carregarDadosMestre();
                atualizarUI();
            }
        });

        function checkResponsive() {
            const width = window.innerWidth;
            if (width < 1100) {
                if (!document.getElementById('sidebar-left').classList.contains('collapsed')) toggleSidebar('left', true);
                if (!document.getElementById('sidebar-right').classList.contains('collapsed')) toggleSidebar('right', true);
            }
        }

        function toggleSidebar(side, forceClose = false) {
            const el = document.getElementById(`sidebar-${side}`);
            const btn = document.getElementById(`btn-toggle-${side}`);
            if (forceClose || !el.classList.contains('collapsed')) {
                el.classList.add('collapsed');
                btn.classList.add('bg-navy-800', 'text-white');
                if (side === 'left') appState.ui.leftPanel = false;
                if (side === 'right') appState.ui.rightPanel = false;
            } else {
                el.classList.remove('collapsed');
                btn.classList.remove('bg-navy-800', 'text-white');
                if (side === 'left') appState.ui.leftPanel = true;
                if (side === 'right') appState.ui.rightPanel = true;
            }
            salvarEstado();
        }

        function aplicarEstadoUI() {
            if (window.innerWidth >= 1100) {
                if (!appState.ui.leftPanel) toggleSidebar('left', true);
                if (!appState.ui.rightPanel) toggleSidebar('right', true);
            } else {
                toggleSidebar('left', true);
                toggleSidebar('right', true);
            }
        }

        function carregarDadosMestre() {
            const rawMaster = localStorage.getItem(MASTER_DB_KEY);
            masterData = rawMaster ? JSON.parse(rawMaster) : DEFAULT_MOCK;
            const selectFunc = document.getElementById('config-func');
            const selectBusca = document.getElementById('busca-func');
            const selFunc = selectFunc.value; const selBusca = selectBusca.value;
            selectFunc.innerHTML = '<option value="">ENTIDADE...</option>';
            selectBusca.innerHTML = '<option value="">BUSCAR...</option>';
            getFuncionariosEscala().forEach(f => {
                const n = f.apelido || f.nome;
                selectFunc.add(new Option(n, n));
                selectBusca.add(new Option(n, n));
            });
            if(selFunc) selectFunc.value = selFunc;
            if(selBusca) selectBusca.value = selBusca;
        }

        function carregarDados() {
            carregarDadosMestre();
            const rawConfig = localStorage.getItem(CONFIG_DB_KEY);
            if(rawConfig) {
                const s = JSON.parse(rawConfig);
                appState.regrasFixas = s.regrasFixas || [];
                appState.escala = s.escala || [];
                appState.destaques = s.destaques || {};
                appState.observacoes = s.observacoes || {};
                appState.observacoesConfig = s.observacoesConfig || {};
                appState.ui = { ...appState.ui, ...(s.ui || {}) }; 
                
                if(s.structure && s.structure.length > 0) {
                    appState.structure = s.structure.map(g => ({
                        ...g,
                        grayTitle: g.grayTitle !== undefined ? g.grayTitle : false, 
                        cols: g.cols.map(c => ({
                            ...c,
                            grayHeader: c.grayHeader !== undefined ? c.grayHeader : (c.gray || false), 
                            grayBody: c.grayBody !== undefined ? c.grayBody : (c.gray || false)
                        }))
                    }));
                }
                
                if(appState.escala.length) {
                    appState.escala.forEach(l => {
                        l.data = new Date(l.data);
                        l.diaSemana = new Date(l.diaSemana);
                    });
                }
            }

            const rawModels = localStorage.getItem(MODELS_DB_KEY);
            appState.models = rawModels ? JSON.parse(rawModels) : [];
            
            document.getElementById('mes-select').value = appState.mes;
            document.getElementById('ano-input').value = appState.ano;
        }

        function salvarEstado() {
            localStorage.setItem(CONFIG_DB_KEY, JSON.stringify(appState));
        }

        function setupEvents() {
            document.getElementById('gerar-escala-btn').addEventListener('click', () => gerarEscala(false));
            document.getElementById('embaralhar-btn').addEventListener('click', () => gerarEscala(true));
            document.getElementById('prev-month').addEventListener('click', () => mudarMes(-1));
            document.getElementById('next-month').addEventListener('click', () => mudarMes(1));
            document.getElementById('mes-select').addEventListener('change', (e) => { appState.mes = parseInt(e.target.value); atualizarUI(); });
            document.getElementById('ano-input').addEventListener('change', (e) => { appState.ano = parseInt(e.target.value); atualizarUI(); });
            document.getElementById('input-importar').addEventListener('change', importarDados);
            document.getElementById('btn-troca-rapida').addEventListener('click', toggleTrocaRapida);
            document.getElementById('btn-export-toggle').addEventListener('click', (e) => { e.stopPropagation(); document.getElementById('export-menu').classList.toggle('hidden'); });
            document.addEventListener('click', (e) => {
                const menu = document.getElementById('export-menu');
                const btn = document.getElementById('btn-export-toggle');
                if(menu && !menu.classList.contains('hidden') && !menu.contains(e.target) && e.target !== btn) { menu.classList.add('hidden'); }
            });
            document.getElementById('tabela-escala').addEventListener('click', (e) => {
                const cell = e.target.closest('.editable');
                if(!cell) return;
                if(modoTrocaRapida) handleTroca(cell);
                else { const nome = cell.innerText.trim(); if(nome && nome !== '-') document.getElementById('busca-func').value = nome; }
            });
            document.getElementById('tabela-escala').addEventListener('dblclick', (e) => {
                if(modoTrocaRapida) return;
                const cell = e.target.closest('.editable');
                if(cell) abrirModal(cell.dataset.idx, cell.dataset.key);
            });
            document.getElementById('editor-obs').addEventListener('input', salvarObservacaoAtual);
        }

        // --- MODELOS ---
        function renderModelos() {
            const lista = document.getElementById('lista-modelos');
            lista.innerHTML = '';
            appState.models.forEach((m, idx) => {
                lista.innerHTML += `
                    <div class="flex justify-between items-center border-b border-gray-200 py-2 text-xs font-mono">
                        <span class="text-navy-900 font-bold truncate">${m.name}</span>
                        <div class="flex gap-3">
                            <button onclick="carregarModelo(${idx})" class="text-navy-900 hover:text-crimson-600 transition-colors" title="Load"><i class="fas fa-upload"></i></button>
                            <button onclick="excluirModelo(${idx})" class="text-gray-400 hover:text-red-600 transition-colors" title="Delete"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>`;
            });
        }

        function salvarModelo() {
            const nomeInput = document.getElementById('novo-modelo-nome');
            const nome = nomeInput.value.trim();
            if(!nome) return alert("Digite um nome para o modelo!");
            
            const modelo = {
                name: nome,
                structure: JSON.parse(JSON.stringify(appState.structure))
            };
            
            appState.models.push(modelo);
            localStorage.setItem(MODELS_DB_KEY, JSON.stringify(appState.models));
            nomeInput.value = '';
            renderModelos();
            alert("Preset Salvo no Core!");
        }

        function carregarModelo(idx) {
            if(!confirm("Atenção: Carregar este preset substituirá a matriz atual. Confirmar sobrescrita?")) return;
            const modelo = appState.models[idx];
            appState.structure = JSON.parse(JSON.stringify(modelo.structure));
            salvarEstado();
            atualizarUI();
        }

        function excluirModelo(idx) {
            if(!confirm("Excluir preset do banco de dados?")) return;
            appState.models.splice(idx, 1);
            localStorage.setItem(MODELS_DB_KEY, JSON.stringify(appState.models));
            renderModelos();
        }

        // --- DRAG AND DROP ---
        let dragSrcEl = null;

        function handleDragStart(e, type, gIdx, cIdx = null) {
            dragSrcEl = e.target;
            e.target.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('type', type);
            e.dataTransfer.setData('gIdx', gIdx);
            if(cIdx !== null) e.dataTransfer.setData('cIdx', cIdx);
        }

        function handleDragOver(e) {
            if (e.preventDefault) e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            const target = e.target.closest('.draggable-item') || e.target.closest('.drop-target-group');
            if(target && target !== dragSrcEl) {
                target.classList.add('drag-over');
            }
            return false;
        }

        function handleDragLeave(e) {
            const target = e.target.closest('.draggable-item') || e.target.closest('.drop-target-group');
            if(target) target.classList.remove('drag-over');
        }

        function handleDrop(e, targetType, targetGIdx, targetCIdx = null) {
            if (e.stopPropagation) e.stopPropagation();
            document.querySelectorAll('.dragging').forEach(el => el.classList.remove('dragging'));
            document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));

            const srcType = e.dataTransfer.getData('type');
            const srcGIdx = parseInt(e.dataTransfer.getData('gIdx'));
            
            if(srcType === 'group' && targetType === 'group') {
                if(srcGIdx !== targetGIdx) {
                    const item = appState.structure.splice(srcGIdx, 1)[0];
                    appState.structure.splice(targetGIdx, 0, item);
                    salvarEstado(); atualizarUI();
                }
            }

            if(srcType === 'col' && targetType === 'col') {
                const srcCIdx = parseInt(e.dataTransfer.getData('cIdx'));
                if(srcGIdx === targetGIdx && srcCIdx === targetCIdx) return;
                const item = appState.structure[srcGIdx].cols.splice(srcCIdx, 1)[0];
                appState.structure[targetGIdx].cols.splice(targetCIdx, 0, item);
                salvarEstado(); atualizarUI();
            }

            if(srcType === 'col' && targetType === 'group') {
                const srcCIdx = parseInt(e.dataTransfer.getData('cIdx'));
                if(srcGIdx === targetGIdx) return;
                const item = appState.structure[srcGIdx].cols.splice(srcCIdx, 1)[0];
                appState.structure[targetGIdx].cols.push(item);
                salvarEstado(); atualizarUI();
            }

            return false;
        }

        function renderEditorEstrutura() {
            const container = document.getElementById('editor-estrutura-lista');
            container.innerHTML = '';

            appState.structure.forEach((group, gIdx) => {
                const groupEl = document.createElement('div');
                // Estilo Surreal Shard
                groupEl.className = "bg-white border-2 border-navy-900 drop-target-group mb-4 shadow-[4px_4px_0px_rgba(15,23,42,0.1)]";
                
                groupEl.setAttribute('draggable', 'true');
                groupEl.addEventListener('dragstart', (e) => handleDragStart(e, 'group', gIdx));
                groupEl.addEventListener('dragover', handleDragOver);
                groupEl.addEventListener('dragleave', handleDragLeave);
                groupEl.addEventListener('drop', (e) => {
                     if(!e.target.closest('.col-item')) handleDrop(e, 'group', gIdx);
                });

                const headerEl = document.createElement('div');
                headerEl.className = "bg-gray-50 p-2.5 flex gap-2 items-center border-b-2 border-navy-900 cursor-grab active:cursor-grabbing";
                headerEl.innerHTML = `
                    <i class="fas fa-grip-vertical text-gray-400 text-xs"></i>
                    <i class="fas fa-folder-open text-navy-900 text-xs"></i>
                    <input type="text" value="${group.title}" 
                        onchange="updateGroupTitle(${gIdx}, this.value)"
                        class="bg-transparent text-xs font-black text-navy-900 w-full focus:outline-none focus:bg-white border border-transparent focus:border-crimson-600 px-1 transition-colors uppercase tracking-widest font-mono" placeholder="NOME DO CLUSTER">
                    
                    <button onclick="toggleGroupGray(${gIdx})" 
                        class="text-[10px] px-2 py-1 border transition-colors ${group.grayTitle ? 'bg-navy-900 text-white border-navy-900' : 'bg-white text-gray-400 border-gray-300 hover:border-navy-900 hover:text-navy-900'}"

        // --- GERAÇÃO DE ESCALA ---
        function gerarEscala(embaralhar) {
            const mes = appState.mes; const ano = appState.ano; const diasNoMes = new Date(ano, mes + 1, 0).getDate(); 
            const feriadosStr = masterData.feriados.map(f => f.data); 
            const pool = getFuncionariosEscala();
            
            if(pool.length === 0) return alert("Sem dados no Master DB.");
            
            const flatCols = getFlatColumns(); 
            const slotsKeys = flatCols.filter(c => c.type !== 'system').map(c => c.key); 
            
            const stats = {}; 
            const colStats = {};
            
            pool.forEach(f => { 
                const n = f.apelido || f.nome; 
                stats[n] = { total: 0 }; 
                colStats[n] = {}; 
                slotsKeys.forEach(k => colStats[n][k] = 0); 
            });

            const novaEscala = []; 
            let senhaIdx = 0; 
            const poolSenha = masterData.funcionarios.filter(f => f.tipo === 'escala' && f.categoria === 'Funcionário da Senha'); 
            
            let randomSeed = 12345;
            const pseudoRandom = () => { randomSeed = (randomSeed * 9301 + 49297) % 233280; return randomSeed / 233280; };
            const getRandom = () => embaralhar ? Math.random() : pseudoRandom();

            for(let d=1; d<=diasNoMes; d++) {
                const dataObj = new Date(ano, mes, d); 
                const diaSemana = dataObj.getDay(); 
                const dataISO = dataObj.toISOString().split('T')[0];
                
                if(diaSemana === 0 || diaSemana === 6 || feriadosStr.includes(dataISO)) continue;
                
                const linha = { data: dataObj, diaSemana: dataObj, senha: '' }; 
                slotsKeys.forEach(k => linha[k] = ''); 
                
                if(poolSenha.length > 0) { 
                    linha.senha = (poolSenha[senhaIdx].apelido || poolSenha[senhaIdx].nome); 
                    senhaIdx = (senhaIdx + 1) % poolSenha.length; 
                }
                
                const escaladosNoDia = new Set();
                const slotsOcupados = new Set();
                
                appState.regrasFixas.forEach(r => { 
                    if(slotsKeys.includes(r.slot)) { 
                        const funcObj = masterData.funcionarios.find(f => (f.apelido || f.nome) === r.func);
                        let emFerias = false;
                        if (funcObj) {
                            emFerias = masterData.ferias.some(fer => { 
                                if(fer.funcionario !== funcObj.nome) return false; 
                                const ini = new Date(fer.inicio+'T00:00:00'); 
                                const fim = new Date(fer.fim+'T00:00:00'); 
                                return dataObj >= ini && dataObj <= fim; 
                            });
                        }
                        slotsOcupados.add(r.slot);
                        if (!emFerias) {
                            linha[r.slot] = r.func; 
                            escaladosNoDia.add(r.func); 
                            atualizarStats(r.func, r.slot, stats, colStats); 
                        } else {
                            linha[r.slot] = '';
                        }
                    } 
                });
                
                const slotsLivres = slotsKeys.filter(s => !slotsOcupados.has(s));
                const diaAnterior = novaEscala.length > 0 ? novaEscala[novaEscala.length - 1] : null;
                
                const candidatosDisponiveis = pool.filter(f => { 
                    const n = f.apelido || f.nome; 
                    if(escaladosNoDia.has(n)) return false; 
                    const emFerias = masterData.ferias.some(fer => { 
                        if(fer.funcionario !== f.nome) return false; 
                        const ini = new Date(fer.inicio+'T00:00:00'); 
                        const fim = new Date(fer.fim+'T00:00:00'); 
                        return dataObj >= ini && dataObj <= fim; 
                    }); 
                    return !emFerias; 
                });

                const opcoes = [];
                
                candidatosDisponiveis.forEach(cand => {
                    const nome = cand.apelido || cand.nome;
                    slotsLivres.forEach(slot => {
                        const countSlot = colStats[nome][slot] || 0;
                        const countTotal = stats[nome].total || 0;
                        let penalty = 0;
                        if (diaAnterior && diaAnterior[slot] === nome) penalty = 100000;
                        const score = penalty + (countSlot * 1000) + countTotal;
                        opcoes.push({ nome: nome, slot: slot, score: score, rand: getRandom() });
                    });
                });

                opcoes.sort((a, b) => {
                    if (a.score !== b.score) return a.score - b.score;
                    return a.rand - b.rand;
                });

                const assignedSlots = new Set();
                const assignedPeople = new Set();

                for (const op of opcoes) {
                    if (assignedSlots.has(op.slot)) continue;
                    if (assignedPeople.has(op.nome)) continue;

                    linha[op.slot] = op.nome;
                    assignedSlots.add(op.slot);
                    assignedPeople.add(op.nome);
                    atualizarStats(op.nome, op.slot, stats, colStats);
                    
                    if (assignedSlots.size === slotsLivres.length || assignedPeople.size === candidatosDisponiveis.length) break;
                }

                novaEscala.push(linha);
            }
            
            appState.escala = novaEscala; 
            salvarEstado(); 
            atualizarUI();
        }

        function atualizarStats(nome, slot, stats, colStats) { 
            if(!stats[nome]) return; 
            stats[nome].total++; 
            if(colStats[nome]) colStats[nome][slot]++; 
        }

        // --- RESUMO ---
        function renderResumo() {
            const headerRow = document.getElementById('resumo-header');
            const tbody = document.getElementById('lista-resumo');
            if(!headerRow || !tbody) return;
            
            headerRow.innerHTML = ''; tbody.innerHTML = '';

            const flatCols = getFlatColumns().filter(c => c.type !== 'system');
            const colsFixos = flatCols.filter(c => c.type === 'fixo');
            const colsSuplentes = flatCols.filter(c => c.type === 'suplente');
            const colsOutros = flatCols.filter(c => c.type !== 'fixo' && c.type !== 'suplente');
            const sortedCols = [...colsFixos, ...colsSuplentes, ...colsOutros];
            
            let headerHTML = `<th class="resumo-col-nome font-mono font-black p-1.5 tracking-widest uppercase">NOME</th>`;
            
            sortedCols.forEach(c => {
                let label = c.label || '';
                let shortLabel = label.substring(0, 3).toUpperCase();
                let colorClass = 'text-gray-500 font-mono bg-white';
                if(c.type === 'fixo') colorClass = 'text-navy-900 font-mono bg-gray-100';
                
                headerHTML += `<th class="p-1.5 font-bold ${colorClass}" title="${label}">${shortLabel}</th>`;
            });

            headerHTML += `<th class="p-1.5 font-bold text-white bg-navy-900 font-mono">T</th>`;
            headerRow.innerHTML = headerHTML;

            const stats = {}; 
            getFuncionariosEscala().forEach(f => {
                const nome = f.apelido || f.nome;
                stats[nome] = { total: 0 };
                sortedCols.forEach(c => stats[nome][c.key] = 0);
            });

            appState.escala.forEach(l => { 
                if(l.data.getMonth() !== appState.mes) return; 
                sortedCols.forEach(c => { 
                    const nome = l[c.key]; 
                    if(nome && stats[nome]) { 
                        stats[nome][c.key]++;
                        stats[nome].total++;
                    } 
                }); 
            });

            const nomesOrdenados = Object.keys(stats).sort();

            nomesOrdenados.forEach(n => {
                const s = stats[n];
                let rowHTML = `<tr>`;
                rowHTML += `<td class="resumo-col-nome font-bold p-1 text-[11px] truncate text-navy-900" title="${n}">${n}</td>`;

                sortedCols.forEach(c => {
                    const count = s[c.key];
                    const valClass = count > 0 ? 'text-crimson-600 font-bold' : 'text-gray-300';
                    rowHTML += `<td class="p-1 text-center font-mono ${valClass}">${count}</td>`;
                });

                rowHTML += `<td class="p-1 text-center font-bold text-white bg-navy-800 font-mono border-l border-navy-700">${s.total}</td>`;
                rowHTML += `</tr>`;
                tbody.innerHTML += rowHTML;
            });
        }

        function importarDados(e) { 
            const f = e.target.files[0]; 
            if(!f) return; 
            const r = new FileReader(); 
            r.onload = (ev) => { 
                try { 
                    const j = JSON.parse(ev.target.result); 
                    if(j.funcionarios) { 
                        localStorage.setItem(MASTER_DB_KEY, JSON.stringify(j)); 
                        masterData = j; 
                        atualizarUI(); 
                        alert("Database Core Restaurado!"); 
                    } else { alert("Arquivo corrompido."); }
                } catch(e) { alert("Erro de parsing."); }
            }; 
            r.readAsText(f); 
        }

        function toggleTrocaRapida() { modoTrocaRapida = !modoTrocaRapida; const btn = document.getElementById('btn-troca-rapida'); const p = document.getElementById('painel-central'); trocaOrigem = null; document.querySelectorAll('.celula-troca-origem').forEach(el => el.classList.remove('celula-troca-origem')); if(modoTrocaRapida) { btn.classList.add('btn-active'); p.classList.add('cursor-troca'); } else { btn.classList.remove('btn-active'); p.classList.remove('cursor-troca'); } }
        function handleTroca(cell) { if(!trocaOrigem) { trocaOrigem = { idx: cell.dataset.idx, key: cell.dataset.key, el: cell }; cell.classList.add('celula-troca-origem'); } else { const dest = { idx: cell.dataset.idx, key: cell.dataset.key }; const v1 = appState.escala[trocaOrigem.idx][trocaOrigem.key]; const v2 = appState.escala[dest.idx][dest.key]; appState.escala[trocaOrigem.idx][trocaOrigem.key] = v2; appState.escala[dest.idx][dest.key] = v1; trocaOrigem.el.classList.remove('celula-troca-origem'); trocaOrigem = null; toggleTrocaRapida(); salvarEstado(); atualizarUI(); } }
        function abrirModalMestre() { const funcBody = document.getElementById('mestre-funcs'); funcBody.innerHTML = ''; masterData.funcionarios.forEach(f => { const almoco = (f.saida1 && f.entrada2) ? `${f.saida1} - ${f.entrada2}` : '-'; funcBody.innerHTML += `<tr><td class="p-3 border-b border-gray-100 text-navy-900 font-bold">${f.apelido||f.nome}</td><td class="p-3 border-b border-gray-100">${f.cargo}</td><td class="p-3 border-b border-gray-100 text-gray-500">${almoco}</td></tr>`; }); const feriasBody = document.getElementById('mestre-ferias'); feriasBody.innerHTML = ''; masterData.ferias.forEach(f => { feriasBody.innerHTML += `<tr><td class="p-2 border-b border-gray-100 text-navy-900 font-bold">${f.funcionario}</td><td class="p-2 border-b border-gray-100">${f.inicio}</td><td class="p-2 border-b border-gray-100">${f.fim}</td></tr>`; }); const feriadosBody = document.getElementById('mestre-feriados'); feriadosBody.innerHTML = ''; masterData.feriados.forEach(f => { feriadosBody.innerHTML += `<tr><td class="p-2 border-b border-gray-100 text-crimson-600 font-bold">${f.data}</td><td class="p-2 border-b border-gray-100">${f.nome}</td></tr>`; }); document.getElementById('modal-mestre').classList.remove('hidden'); }
        function abrirModal(idx, key) { editando = { idx, key }; const linha = appState.escala[idx]; const modalSelect = document.getElementById('modal-select'); const modalInput = document.getElementById('modal-input'); modalSelect.classList.add('hidden'); modalInput.classList.add('hidden'); let valorAtual = linha[key]; if(key === 'dataLabel' && !valorAtual) valorAtual = linha.data.toLocaleDateString('pt-BR'); if(key === 'semLabel' && !valorAtual) valorAtual = linha.diaSemana.toLocaleDateString('pt-BR', {weekday: 'short'}).toUpperCase(); if(key === 'senha' && !valorAtual) valorAtual = linha.senha; const isSystemCol = key === 'dataLabel' || key === 'semLabel'; if (isSystemCol) { modalInput.value = valorAtual || ''; modalInput.classList.remove('hidden'); } else { modalSelect.innerHTML = '<option value="">(NULL)</option>'; let list = []; if(key === 'senha') { list = masterData.funcionarios.map(f => (f.apelido || f.nome)); } else { list = getFuncionariosEscala().map(f => (f.apelido || f.nome)); } list.sort(); list.forEach(nome => { const opt = new Option(nome, nome); if(nome === valorAtual) opt.selected = true; modalSelect.add(opt); }); modalSelect.classList.remove('hidden'); } document.getElementById('modal-edicao').classList.remove('hidden'); }
        function salvarEdicaoManual() { if(!editando) return; const modalSelect = document.getElementById('modal-select'); const modalInput = document.getElementById('modal-input'); let novoValor = !modalSelect.classList.contains('hidden') ? modalSelect.value : modalInput.value; appState.escala[editando.idx][editando.key] = novoValor; salvarEstado(); atualizarUI(); fecharModal(); }
        function fecharModal() { document.getElementById('modal-edicao').classList.add('hidden'); editando = null; }
        
        async function exportarExcelOriginal() {
            if (appState.escala.length === 0) return alert("Matriz vazia.");
            const mesNome = document.getElementById('mes-select').options[appState.mes].text.toUpperCase(); const ano = appState.ano;
            const wb = new ExcelJS.Workbook(); const ws = wb.addWorksheet('Matrix');
            ws.pageSetup = { paperSize: 9, orientation: 'landscape', fitToPage: true, fitToWidth: 1, fitToHeight: 1, horizontalCentered: true, verticalCentered: true, margins: { left: 0.2, right: 0.2, top: 0.2, bottom: 0.2, header: 0.1, footer: 0.1 } };
            const borderStyle = { top: {style:'thin'}, left: {style:'thin'}, bottom: {style:'thin'}, right: {style:'thin'} }; const center = { alignment: { horizontal: 'center', vertical: 'middle', wrapText: true }, border: borderStyle }; const gray = { ...center, fill: { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFD9D9D9' } } }; const fontData = { name: 'Calibri', size: 8 }; const fontHeader = { bold: true, name: 'Calibri', size: 9 }; const fontTitle = { bold: true, name: 'Calibri', size: 12 };
            const flatCols = getFlatColumns(); const totalCols = flatCols.length; const processText = (text) => text ? text.toString().replace(/\|/g, '\n') : '';
            ws.getRow(1).height = 30; ws.mergeCells(1, 1, 1, totalCols); const title = ws.getCell(1, 1); title.value = `ESCALA DO GUICHÊ PARA ${mesNome}/${ano}`; title.style = { font: fontTitle, alignment: { horizontal: 'center', vertical: 'middle' }, border: borderStyle }; for(let c = 1; c <= totalCols; c++) { ws.getCell(1, c).border = borderStyle; }
            let colIdx = 1; appState.structure.forEach(g => { if(g.cols.length > 0) { ws.mergeCells(2, colIdx, 4, colIdx + g.cols.length - 1); const cell = ws.getCell(2, colIdx); cell.value = processText(g.title); const groupStyle = g.grayTitle ? gray : center; cell.style = { ...groupStyle, font: fontHeader }; for(let r=2; r<=4; r++) { for(let c=colIdx; c<colIdx+g.cols.length; c++) { ws.getCell(r,c).border = borderStyle; } } colIdx += g.cols.length; } });
            const headers = []; const colWidths = []; const pxToExcel = (px) => px / 7;
            flatCols.forEach((c, idx) => { const labelRaw = c.label.toUpperCase(); const labelProcessed = processText(labelRaw); headers.push(labelProcessed); let widthVal = pxToExcel(83); if (idx === 0 || idx === 1) { widthVal = pxToExcel(63); } else if (idx === 8 || idx === 9) { widthVal = pxToExcel(90); } colWidths.push({ width: widthVal }); }); ws.columns = colWidths;
            const r5 = ws.getRow(5); r5.height = 18.75; r5.values = headers; r5.eachCell((c, colNumber) => { const col = flatCols[colNumber-1]; const isGray = col.grayHeader; c.style = isGray ? { ...center, fill: { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFD9D9D9' } } } : center; c.font = fontHeader; c.border = borderStyle; });
            let rowIdx = 6; appState.escala.filter(l => l.data.getMonth() === appState.mes).forEach(l => { const rowVals = []; flatCols.forEach(c => { let val = l[c.key] || ''; if(c.key === 'dataLabel') val = l.data.toLocaleDateString('pt-BR'); if(c.key === 'semLabel') val = l.diaSemana.toLocaleDateString('pt-BR', {weekday: 'short'}).replace('.', '').toUpperCase(); if(c.key === 'senha') val = l.senha || ''; rowVals.push(val); }); const r = ws.getRow(rowIdx); r.values = rowVals; r.height = 15; r.eachCell((cell, colNum) => { const col = flatCols[colNum-1]; const isGray = col.grayBody; cell.style = isGray ? gray : center; cell.font = fontData; cell.border = borderStyle; }); rowIdx++; });
            
            const buffer = await wb.xlsx.writeBuffer();
            saveAs(new Blob([buffer]), `Escala_${mesNome}_${ano}.xlsx`);
        }

        function exportarPDFOriginal() {
            if (appState.escala.length === 0) return alert("Matriz vazia.");
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('landscape');
            const mesNome = document.getElementById('mes-select').options[appState.mes].text.toUpperCase(); 
            const ano = appState.ano;
            
            doc.text(`ESCALA DO GUICHÊ PARA ${mesNome}/${ano}`, 14, 15);
            
            const flatCols = getFlatColumns();
            const head = [flatCols.map(c => c.label)];
            const body = appState.escala.filter(l => l.data.getMonth() === appState.mes).map(l => {
                return flatCols.map(c => {
                    let val = l[c.key] || ''; 
                    if(c.key === 'dataLabel') val = l.data.toLocaleDateString('pt-BR'); 
                    if(c.key === 'semLabel') val = l.diaSemana.toLocaleDateString('pt-BR', {weekday: 'short'}).toUpperCase(); 
                    if(c.key === 'senha') val = l.senha || '';
                    return val;
                });
            });

            doc.autoTable({
                head: head,
                body: body,
                startY: 20,
                styles: { fontSize: 7, halign: 'center', cellPadding: 1 },
                headStyles: { fillColor: [200, 200, 200], textColor: [0, 0, 0] }
            });

            const editorEl = document.getElementById('editor-obs');
            let obsText = editorEl.innerText || "";
            
            if (obsText.trim()) { 
                const finalY = doc.lastAutoTable.finalY + 10; 
                doc.setFontSize(10); 
                const maxWidth = 270; 
                const splitText = doc.splitTextToSize(obsText, maxWidth); 
                doc.text(splitText, 14, finalY); 
            } 
            
            doc.save(`Escala_${mesNome}_${ano}.pdf`);
        }
    </script>
