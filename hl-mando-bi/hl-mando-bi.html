<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HL_MANDO // Tactical Engine V17 - Procedural BI</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&family=Inter:wght@400;600;800;900&family=Space+Grotesk:wght@400;700&family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

<style>
  :root {
    --bg-color: #030305;
    --panel-bg: #0a0a0f;
    --accent-1: #00ffcc;
    --accent-2: #ff00ff;
    --accent-3: #ffcc00;
    --good-color: #00ff66;
    --warn-color: #ffcc00;
    --bad-color: #ff2a55;
    --text-main: #cfd0d4;
    --text-dim: #7a7d85;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; width: 100%; margin: 0; padding: 0; overflow: hidden; }
  body {
    background-color: var(--bg-color);
    color: var(--text-dim);
    font-family: 'Fira Code', monospace;
    transition: background-color 0.8s ease;
  }

  /* ============ PROCEDURAL BACKGROUNDS ============ */
  .bg-grid-neon      { background-image: linear-gradient(rgba(0,255,204,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(0,255,204,.06) 1px, transparent 1px); background-size: 32px 32px; }
  .bg-hex            { background-color: var(--bg-color); background-image: radial-gradient(circle at 50% 50%, rgba(255,0,255,.06) 1px, transparent 1.5px); background-size: 24px 42px; background-position: 0 0, 12px 21px; }
  .bg-blueprint      { background-color: #061428; background-image: linear-gradient(rgba(80,180,255,.08) 1px, transparent 1px), linear-gradient(90deg, rgba(80,180,255,.08) 1px, transparent 1px), linear-gradient(rgba(80,180,255,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(80,180,255,.04) 1px, transparent 1px); background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px; }
  .bg-circuit        { background-color: #050a08; background-image: linear-gradient(45deg, rgba(0,255,150,.05) 25%, transparent 25%), linear-gradient(-45deg, rgba(0,255,150,.05) 25%, transparent 25%); background-size: 22px 22px; }
  .bg-carbon         { background-color: #0b0b0d; background-image: radial-gradient(rgba(255,255,255,.03) 1px, transparent 1px), radial-gradient(rgba(255,255,255,.02) 1px, transparent 1px); background-size: 4px 4px, 4px 4px; background-position: 0 0, 2px 2px; }
  .bg-mesh           { background: radial-gradient(at 20% 20%, rgba(120,60,255,.25), transparent 45%), radial-gradient(at 80% 30%, rgba(0,220,255,.2), transparent 45%), radial-gradient(at 40% 90%, rgba(255,0,150,.2), transparent 45%), #05060c; }
  .bg-map            { background-color: #04060c; background-image: radial-gradient(circle at 30% 40%, rgba(0,180,255,.15), transparent 25%), radial-gradient(circle at 70% 60%, rgba(0,255,180,.1), transparent 25%), linear-gradient(rgba(255,255,255,.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px); background-size: auto, auto, 40px 40px, 40px 40px; }

  /* ============ GRID MATEMÁTICO & CARD STYLES ============ */
  #dynamic-grid {
    display: grid;
    grid-template-columns: repeat(12, minmax(0, 1fr));
    grid-template-rows: repeat(6, minmax(0, 1fr));
    gap: 0.5rem;
    height: 100%;
    width: 100%;
    overflow: hidden; 
    grid-auto-flow: dense;
  }

  .card { 
    position: relative; display: flex; flex-direction: column; overflow: hidden; 
    border-radius: 6px; transition: transform .35s, box-shadow .35s; 
    min-height: 0; min-width: 0; 
  }
  .card:hover { transform: translateY(-2px); z-index: 50; }
  .card-inner { position: relative; z-index: 2; display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; padding: 10px; width: 100%; height: 100%; }
  
  .chart-wrapper { position: relative; flex: 1 1 auto; min-height: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  .chart-wrapper > div, .chart-wrapper canvas { position: absolute !important; inset: 0; width: 100% !important; height: 100% !important; }

  /* ============ CARD THEMES (12 estilos, sempre variados) ============ */
  .cs-cyber           { background: linear-gradient(145deg, #0a0a12, #05050a); border: 1px solid #1a1a22; box-shadow: 0 6px 30px rgba(0,0,0,.6), inset 0 0 12px rgba(0,255,204,.05); }
  .cs-glass           { background: linear-gradient(135deg, rgba(255,255,255,.05), rgba(255,255,255,.01)); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,.1); box-shadow: 0 8px 32px rgba(0,0,0,.3); }
  .cs-neuo            { background: #151515; box-shadow: 5px 5px 10px #0a0a0a, -5px -5px 10px #202020; border: none; }
  .cs-material        { background: #1e1e24; border: none; box-shadow: 0 4px 6px rgba(0,0,0,.3); border-radius: 8px; }
  .cs-military        { background: rgba(10,15,10,.9); border: 1px solid rgba(0,255,0,.2); }
  .cs-luxury          { background: linear-gradient(145deg, #1a1408, #2a1e0a); border: 1px solid #d4af37; }
  .cs-holo            { background: linear-gradient(160deg, rgba(255,255,255,.06), rgba(255,255,255,0) 60%), #0a0a10; border: 1px solid transparent; background-clip: padding-box; position: relative; box-shadow: 0 8px 28px rgba(0,0,0,.5); }
  .cs-holo::before    { content:''; position:absolute; inset:0; padding:1px; border-radius:6px; background: var(--gradient); -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude; opacity:.8; pointer-events:none; }
  .cs-retro           { background: repeating-linear-gradient(180deg, #14031c 0px, #14031c 2px, #1a0522 2px, #1a0522 4px); border: 1px solid #ff2ee0; box-shadow: 0 0 0 1px rgba(255,46,224,.15), 0 8px 24px rgba(255,0,200,.15); }
  .cs-brutal          { background: #111214; border: 2px solid #fff; border-radius: 0; box-shadow: 6px 6px 0 rgba(255,255,255,.15); }
  .cs-aurora          { background: radial-gradient(120% 100% at 0% 0%, rgba(255,255,255,.08), transparent 55%), #0b0b10; border: 1px solid rgba(255,255,255,.06); box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  .cs-outline         { background: rgba(5,5,8,.55); border: 1.5px solid var(--gradient-solid, #444); box-shadow: none; }
  .cs-frost           { background: rgba(20,22,30,.55); backdrop-filter: blur(18px) saturate(140%); border: 1px solid rgba(255,255,255,.14); box-shadow: 0 4px 20px rgba(0,0,0,.35); }
  .cs-carbon2         { background-color: #101012; background-image: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px); background-size: 6px 6px; border: 1px solid #26262a; box-shadow: 0 6px 22px rgba(0,0,0,.55); }

  /* ============ TITLES & TYPOGRAPHY ============ */
  .title-tag  { font-size: 9px; letter-spacing: .2em; text-transform: uppercase; font-weight: 700; color: var(--accent-1); text-shadow: 0 0 8px rgba(0,255,204,.3); }
  .title-serif{ font-family: 'Space Grotesk', sans-serif; font-size: 11px; }
  .title-mono { font-family: 'JetBrains Mono', monospace; font-size: 10px;}
  .title-hud  { font-family: 'Orbitron', sans-serif; font-size: 10px; letter-spacing: 0.1em;}

  .kpi-value  { font-family: 'Inter', sans-serif; font-weight: 900; letter-spacing: -.03em; line-height: 1; color: #fff; font-size: clamp(1.5rem, 4vw, 3rem); text-shadow: 0 2px 10px rgba(0,0,0,.5); }
  .kpi-value.grad-text { background: var(--gradient); -webkit-background-clip: text; background-clip: text; color: transparent; }

  /* ============ CONTROLES FLUTUANTES POWER BI ============ */
  .card-controls {
    position: absolute; top: 4px; right: 4px; z-index: 100;
    display: flex; flex-direction: column; gap: 2px;
    background: rgba(0,0,0,0.9); padding: 4px; border-radius: 4px;
    border: 1px solid var(--accent-1); box-shadow: 0 4px 15px rgba(0,0,0,0.8);
    opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .card:hover .card-controls { opacity: 1; pointer-events: auto; }
  .ctrl-row { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
  .ctrl-lbl { font-size: 7px; color: #aaa; font-weight: bold; width: 35px; text-align: right; text-transform: uppercase; }
  .ctrl-select { 
    background: #111; color: #fff; border: 1px solid #333; font-size: 8px; 
    border-radius: 2px; padding: 1px; width: 85px; outline: none; cursor: pointer; 
  }
  .ctrl-select:hover { border-color: var(--accent-1); }

  /* ============ UI COMPONENTS ============ */
  .grad-bar   { position: absolute; inset: auto 0 0 0; height: 3px; background: var(--gradient); z-index: 5; }
  .grad-glow  { position: absolute; inset: 0; background: var(--gradient); opacity: .1; z-index: 0; pointer-events: none; filter: blur(25px); }

  .log-table { border-collapse: collapse; width: 100%; table-layout: fixed; }
  .log-table th { background: rgba(0,0,0,.5); color: var(--accent-2); font-size: 9px; padding: 4px; text-align: left; border-bottom: 1px solid var(--accent-2); position: sticky; top: 0; }
  .log-table td { padding: 4px; font-size: 9px; color: var(--text-main); border-bottom: 1px solid rgba(255,255,255,.05); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--accent-1); border-radius: 4px; opacity: .5; }

  @keyframes fade-in { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }
  .anim-fade { animation: fade-in .4s ease-out both; }
  
  .tab-btn { border-bottom: 2px solid transparent; transition: all 0.3s ease; }
  .tab-btn.active { border-bottom: 2px solid var(--accent-1); color: var(--accent-1); text-shadow: 0 0 10px var(--accent-1); }
</style>
</head>

<body class="flex flex-col p-1.5 bg-mesh">

  <!-- PRELOADER -->
  <div id="loading-overlay" class="fixed inset-0 flex flex-col items-center justify-center bg-black/95 z-[9999] backdrop-blur-md">
    <div class="w-[400px] card cs-cyber p-8 flex flex-col items-center">
      <i class="fa-solid fa-cube text-6xl text-[color:var(--accent-1)] mb-6 animate-pulse"></i>
      <h2 class="text-white text-sm font-bold tracking-[0.3em] mb-2 title-hud">HL_MANDO CORE v17.3</h2>
      <p class="text-[10px] text-[#888] mt-4 text-center tracking-widest uppercase" id="overlay-subtext">Aguardando Fonte de Dados...</p>
      <button id="btn-upload-initial" class="mt-8 border border-[color:var(--accent-1)] text-[color:var(--accent-1)] hover:bg-[color:var(--accent-1)] hover:text-black transition-all px-8 py-3 font-bold cursor-pointer bg-black/50 text-[11px] uppercase tracking-widest shadow-[0_0_15px_rgba(0,255,204,0.3)]">
        INJETAR MATRIX (.XLSX/.CSV)
      </button>
    </div>
  </div>

  <!-- HEADER -->
  <header class="flex-none min-h-[50px] w-full flex items-center justify-between px-5 cs-cyber mb-1.5 shrink-0 z-50 rounded">
    <div class="flex items-center gap-5">
      <div class="flex items-center gap-3">
        <span class="w-2.5 h-2.5 rounded-full bg-[color:var(--accent-1)] animate-pulse shadow-[0_0_8px_var(--accent-1)]"></span>
        <span class="text-[12px] text-[color:var(--accent-1)] tracking-[0.25em] font-bold title-hud">HL_MANDO <span class="text-white/50">V17.3</span></span>
      </div>
      <div class="h-5 w-[1px] bg-[#333]"></div>
      <h1 class="font-bold text-white tracking-widest text-[10px] uppercase" id="main-dash-title">TACTICAL FEED</h1>
    </div>
    <div class="flex items-center gap-3 text-[10px] tracking-wider">
      <button id="btn-theme" class="border border-[color:var(--accent-2)] text-[color:var(--accent-2)] hover:bg-[color:var(--accent-2)] hover:text-black transition-colors px-3 py-1 flex items-center gap-2 font-bold cursor-pointer rounded"><i class="fa-solid fa-palette"></i> THEME</button>
      <button id="btn-bg" class="border border-[color:var(--accent-3)] text-[color:var(--accent-3)] hover:bg-[color:var(--accent-3)] hover:text-black transition-colors px-3 py-1 flex items-center gap-2 font-bold cursor-pointer rounded"><i class="fa-solid fa-image"></i> BG</button>
      <button id="btn-regenerate" class="border border-white text-white hover:bg-white hover:text-black transition-colors px-3 py-1 flex items-center gap-2 font-bold cursor-pointer rounded"><i class="fa-solid fa-dice"></i> RE-GEN</button>
      <button id="btn-upload" class="border border-[color:var(--accent-1)] text-[color:var(--accent-1)] hover:bg-[color:var(--accent-1)] hover:text-black transition-colors px-3 py-1 flex items-center gap-2 font-bold cursor-pointer rounded"><i class="fa-solid fa-rotate"></i> DATA</button>
      <input type="file" id="file-upload" accept=".xlsx,.xls,.csv" class="hidden">
      
      <!-- Safe indicators with fallbacks -->
      <div class="hidden sm:flex flex-col items-end border-l border-[#333] pl-3">
        <span class="text-[#666] font-semibold">RECORDS</span>
        <span class="text-white font-bold text-[12px]" id="stat-records">0</span>
      </div>
      <div class="hidden sm:flex flex-col items-end border-l border-[#333] pl-3">
        <span class="text-[#666] font-semibold">LAYOUT</span>
        <span class="text-white font-bold text-[12px]" id="stat-layout">--</span>
      </div>
      <div class="flex flex-col items-end border-l border-[#333] pl-3">
        <span class="text-[#666] font-semibold">TIME</span>
        <span class="text-[color:var(--accent-1)] font-bold text-[12px]" id="clock">00:00:00</span>
      </div>
    </div>
  </header>

  <!-- TABS -->
  <div id="tab-navigation" class="flex-none flex items-center gap-6 px-6 py-1.5 mb-1.5 w-full bg-black/40 border-b border-[#222] z-40 rounded" style="display:none;">
    <!-- Filled Dynamically -->
  </div>

  <!-- GRID DE CONTEÚDO 100% PREENCHIDO (12x6) -->
  <div class="flex-1 w-full min-h-0" id="dynamic-grid" style="display:none;"></div>

  <!-- TEMPLATE DOS CONTROLES DO CARD -->
  <template id="tpl-card-controls">
    <div class="card-controls">
      <div class="ctrl-row"><span class="ctrl-lbl">Z(Gráfico)</span><select class="ctrl-select ctrl-type"></select></div>
      <div class="ctrl-row"><span class="ctrl-lbl">C(Operar)</span><select class="ctrl-select ctrl-agg"></select></div>
      <div class="ctrl-row"><span class="ctrl-lbl">X(Eixo/Cat)</span><select class="ctrl-select ctrl-label"></select></div>
      <div class="ctrl-row"><span class="ctrl-lbl">Y(Valor)</span><select class="ctrl-select ctrl-val"></select></div>
    </div>
  </template>

<script>
/* =========================================================================
   HL_MANDO V17.3 — Procedural Dashboard Engine - PERFEIÇÃO MATEMÁTICA
   ========================================================================= */

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const rnd = (arr) => arr[Math.floor(Math.random()*arr.length)];

const updateClock = () => { if($('#clock')) $('#clock').innerText = new Date().toLocaleTimeString('pt-BR',{hour12:false}); };
setInterval(updateClock, 1000); updateClock();

/* ---------------- Formatadores Universais ---------------- */
const formatNum = v => Number(v).toLocaleString('pt-BR',{maximumFractionDigits:1});
const formatMoney = v => 'R$ ' + Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const formatCompact = v => {
  const n = Number(v); const a = Math.abs(n);
  if (a >= 1e9) return (n/1e9).toFixed(1)+'B';
  if (a >= 1e6) return (n/1e6).toFixed(1)+'M';
  if (a >= 1e3) return (n/1e3).toFixed(1)+'K';
  return formatNum(n);
};

const isCritical = s => /custo|despesa|falha|perda|erro|crític|manutenção|atraso/i.test(String(s));
const isGood = s => /receita|lucro|venda|eficiência|sucesso|operacional|aprovado|líquido/i.test(String(s));

function getSmartIcon(t) {
  const s = String(t).toLowerCase();
  if(/peso|tara|carga|kilo/.test(s)) return 'fa-weight-scale';
  if(/custo|valor|preço|r\$|lucro/.test(s)) return 'fa-money-bill-wave';
  if(/veículo|caminhão|frota/.test(s)) return 'fa-truck-fast';
  if(/data|hora|tempo|atraso/.test(s)) return 'fa-clock';
  if(/cidade|estado|uf|local/.test(s)) return 'fa-map-location-dot';
  if(/produto|item|sku/.test(s)) return 'fa-box-open';
  if(/cliente|usuário/.test(s)) return 'fa-users';
  return 'fa-chart-pie';
}

/* ---------------- Global State ---------------- */
let chartInstances = {};
let globalDataset = null;
let globalBlueprints = [];
let globalProfile = null;
let activeTabId = 0;
let currentThemeIndex = 0;
let currentBgIndex = 0;

const THEMES = [
  { name:"CYBER NEON",   bg:'#030305', panel:'#0a0a0f', acc1:'#00ffcc', acc2:'#ff00ff', acc3:'#ffcc00', good:'#00ffcc', warn:'#ffcc00', bad:'#ff2a55', text:'#cfd0d4' },
  { name:"PURPLE SYNTH", bg:'#05000a', panel:'#0d001a', acc1:'#b829ff', acc2:'#00e5ff', acc3:'#ff00aa', good:'#00ffcc', warn:'#ffaa00', bad:'#ff0055', text:'#e0d0ff' },
  { name:"AMBER OPS",    bg:'#080500', panel:'#120800', acc1:'#ff8800', acc2:'#ffcc00', acc3:'#ff2a2a', good:'#00ff66', warn:'#ffaa00', bad:'#ff2a2a', text:'#f0d8b0' },
  { name:"COBALT DEEP",  bg:'#000511', panel:'#030a1c', acc1:'#0088ff', acc2:'#00ffcc', acc3:'#ffaa00', good:'#00ffcc', warn:'#ffaa00', bad:'#ff0055', text:'#c0d8ff' },
  { name:"CRIMSON TIDE", bg:'#0a0002', panel:'#150005', acc1:'#ff1744', acc2:'#ff8a00', acc3:'#ffd600', good:'#00e676', warn:'#ffab00', bad:'#ff1744', text:'#ffd0d6' },
  { name:"EMERALD LAB",  bg:'#00120a', panel:'#001c12', acc1:'#00ffa3', acc2:'#00d4ff', acc3:'#c6ff00', good:'#00ffa3', warn:'#ffea00', bad:'#ff4d6d', text:'#c8fff0' },
  { name:"SUNSET GOLD",  bg:'#120800', panel:'#1e0e00', acc1:'#ffb703', acc2:'#fb5607', acc3:'#ff006e', good:'#8ac926', warn:'#ffb703', bad:'#fb5607', text:'#ffe4c4' },
  { name:"ARCTIC MONO",  bg:'#040608', panel:'#0b0e12', acc1:'#e8ecf1', acc2:'#5eead4', acc3:'#818cf8', good:'#5eead4', warn:'#facc15', bad:'#fb7185', text:'#dbe4ee' },
  { name:"BUBBLEGUM",    bg:'#0a0410', panel:'#160820', acc1:'#ff6ec7', acc2:'#7cf5ff', acc3:'#ffe66d', good:'#7cf5ff', warn:'#ffe66d', bad:'#ff6ec7', text:'#f5d9ff' },
  { name:"FOREST OPS",   bg:'#050a05', panel:'#0c140c', acc1:'#8bc34a', acc2:'#4caf50', acc3:'#cddc39', good:'#8bc34a', warn:'#ffc107', bad:'#e53935', text:'#d4e8c8' }
];

// Gerador procedural de temas: paletas HSL infinitas e sempre novas
function generateProceduralTheme() {
  const hueA = Math.floor(Math.random()*360);
  const hueB = (hueA + 40 + Math.floor(Math.random()*140)) % 360;
  const hueC = (hueA + 180 + Math.floor(Math.random()*90)) % 360;
  const hsl = (h,s,l) => `hsl(${h},${s}%,${l}%)`;
  const names = ['PROTOCOLO','VETOR','NEXUS','ORBITAL','QUANTUM','SINAL','PRISMA','FLUXO','ESPECTRO','NÓMADE'];
  return {
    name: `${rnd(names)} ${Math.floor(100+Math.random()*899)}`,
    bg: hsl(hueA, 40, 3), panel: hsl(hueA, 35, 6),
    acc1: hsl(hueA, 90, 60), acc2: hsl(hueB, 90, 60), acc3: hsl(hueC, 85, 58),
    good: hsl(140, 80, 55), warn: hsl(45, 90, 58), bad: hsl(350, 85, 58),
    text: hsl(hueA, 25, 85)
  };
}

function applyTheme(i, customTheme=null) {
  const t = customTheme || THEMES[i]; const r = document.documentElement;
  r.style.setProperty('--bg-color', t.bg); r.style.setProperty('--panel-bg', t.panel);
  r.style.setProperty('--accent-1', t.acc1); r.style.setProperty('--accent-2', t.acc2); r.style.setProperty('--accent-3', t.acc3);
  r.style.setProperty('--good-color', t.good); r.style.setProperty('--warn-color', t.warn); r.style.setProperty('--bad-color', t.bad);
  currentThemeObj = t;
  if($('#main-dash-title')) $('#main-dash-title').innerHTML = `TACTICAL FEED <span class="text-[color:var(--accent-2)]">// ${t.name}</span>`;
  if(globalDataset) buildDynamicUI(globalBlueprints[activeTabId], globalDataset); // Rebuild with colors
}

// Escolhe tema curado ou procedural (chance de surpresa a cada geração)
function pickRandomTheme() {
  if (Math.random() < 0.45) {
    const idx = Math.floor(Math.random()*THEMES.length);
    currentThemeIndex = idx;
    applyTheme(idx);
  } else {
    applyTheme(-1, generateProceduralTheme());
  }
}

const BGS = ['bg-mesh','bg-grid-neon','bg-hex','bg-blueprint','bg-circuit','bg-carbon','bg-map'];
function applyBg(i) { BGS.forEach(c => document.body.classList.remove(c)); document.body.classList.add(BGS[i % BGS.length]); }
function pickRandomBg() { currentBgIndex = Math.floor(Math.random()*BGS.length); applyBg(currentBgIndex); }

const CARD_STYLES = ['cs-cyber','cs-glass','cs-neuo','cs-material','cs-military','cs-luxury','cs-holo','cs-retro','cs-brutal','cs-aurora','cs-outline','cs-frost','cs-carbon2'];
const GRADIENTS = [
  ['#3b82f6','#8b5cf6'], ['#10b981','#06b6d4'], ['#f97316','#ef4444'], ['#000000','#00ffcc'],
  ['#ec4899','#f43f5e'], ['#facc15','#f97316'], ['#22d3ee','#3b82f6'], ['#a3e635','#22c55e'],
  ['#d946ef','#6366f1'], ['#f472b6','#c026d3'], ['#fb923c','#dc2626'], ['#2dd4bf','#0ea5e9'],
  ['#eab308','#84cc16'], ['#f43f5e','#7c3aed']
];
const TITLE_STYLES = ['title-tag','title-mono','title-hud','title-serif'];
let currentThemeObj = null;

const CHART_TYPES = [
  { id: 'bar', label: 'Barra (V)', lib: 'echarts' }, { id: 'hbar', label: 'Barra (H)', lib: 'echarts' },
  { id: 'line', label: 'Linha', lib: 'echarts' }, { id: 'area', label: 'Área', lib: 'echarts' },
  { id: 'doughnut', label: 'Rosca', lib: 'echarts' }, { id: 'pie', label: 'Pizza', lib: 'echarts' },
  { id: 'radar', label: 'Radar', lib: 'echarts' }, { id: 'heatmap', label: 'Heatmap', lib: 'echarts' },
  { id: 'treemap', label: 'Treemap', lib: 'echarts' }, { id: 'funnel', label: 'Funnel', lib: 'echarts' }
];
const gradCss = (g) => `linear-gradient(135deg, ${g[0]}, ${g[1]})`;

/* ---------------- Inteligência de Dados ---------------- */
function cleanNumberVal(val) {
  if (typeof val === 'number') return val;
  if (!val || String(val).trim() === '') return 0;
  let s = String(val).toUpperCase().replace(/(R\$|KG|KGS|TON|TONS|G|LBS|%)/g,'').trim();
  if (s.includes(',') && s.includes('.')) {
    s = s.indexOf('.') < s.indexOf(',') ? s.replace(/\./g,'').replace(',','.') : s.replace(/,/g,'');
  } else if (s.includes(',')) s = s.replace(',','.');
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}

const DataProfiler = {
  extractBestDataset(workbook) {
    let bestData = [];
    workbook.SheetNames.forEach(sheetName => {
      const raw = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], {defval:null});
      if (raw.length > bestData.length) bestData = raw;
    });
    return bestData;
  },
  profileColumns(dataset) {
    if(!dataset.length) return { dates:[], numbers:[], categories:[], geo:[], all:[] };
    const cols = Object.keys(dataset[0]);
    const profile = { dates:[], numbers:[], categories:[], geo:[], all: cols };
    cols.forEach(col => {
      let tc = { date:0, number:0, string:0, empty:0 };
      const N = Math.min(dataset.length, 50);
      for (let i=0; i<N; i++) {
        let v = dataset[i][col];
        if (v===null||v===undefined||v==='') { tc.empty++; continue; }
        if (typeof v==='number') tc.number++;
        else if (v instanceof Date) tc.date++;
        else if (typeof v==='string') {
          const nt = cleanNumberVal(v);
          if (nt !== 0 || v==='0') tc.number++;
          else if (v.match(/^(0[1-9]|[12][0-9]|3[01])[/\-](0[1-9]|1[012])[/\-]\d{4}/)) tc.date++;
          else tc.string++;
        }
      }
      const valid = N - tc.empty;
      if (valid>0) {
        if (/estado|uf|cidade|município|país|local|destino/i.test(col)) profile.geo.push(col);
        if (tc.number > valid*0.5) profile.numbers.push(col);
        else if (tc.date > valid*0.4) profile.dates.push(col);
        else profile.categories.push(col);
      }
    });
    // Fallbacks
    if(!profile.numbers.length) profile.numbers = cols;
    if(!profile.categories.length) profile.categories = cols;
    return profile;
  },
  
  // GEOMETRIA EXATA (12x6 = 72 células) NUNCA QUEBRA, NUNCA FALTAM BURACOS
  // Cada chamada sorteia layout, colunas de dados e tipos de gráfico -> experiência sempre nova
  generateBlueprint(profile, tabIdx) {
    const pN = profile.numbers; const pC = profile.categories; const pD = profile.dates; const pG = profile.geo;
    let idCounter = tabIdx * 1000 + Math.floor(Math.random()*900);
    const uid = () => `el_${idCounter++}`;

    const safeCat = pC.length ? pC[0] : profile.all[0];
    const safeNum = pN.length ? pN[0] : profile.all[0];
    const safeDate = pD.length ? pD[0] : safeCat;
    const safeGeo = pG.length ? pG[0] : safeCat;

    // Sorteadores de coluna: cada card puxa uma fonte de dado diferente sempre que possível
    const usedNums = []; const usedCats = [];
    const pickNum = () => {
      const pool = pN.length ? pN : profile.all;
      const fresh = pool.filter(c => !usedNums.includes(c));
      const pick = fresh.length ? rnd(fresh) : rnd(pool);
      usedNums.push(pick); return pick;
    };
    const pickCat = () => {
      const pool = pC.length ? pC : profile.all;
      const fresh = pool.filter(c => !usedCats.includes(c));
      const pick = fresh.length ? rnd(fresh) : rnd(pool);
      usedCats.push(pick); return pick;
    };
    const pickDate = () => pD.length ? rnd(pD) : safeCat;
    const pickGeo = () => pG.length ? rnd(pG) : safeCat;
    const pickTableCols = () => {
      const shuffled = [...profile.all].sort(() => Math.random()-0.5);
      return shuffled.slice(0, Math.min(profile.all.length, 6 + Math.floor(Math.random()*3)));
    };

    const CIRCULAR = ['pie','doughnut','radar','funnel'];
    const FLEX = ['bar','hbar','line','area'];
    const WIDE = ['bar','treemap','heatmap','line','area'];
    const pickChart = (group) => rnd(group);

    // item(): tipo, largura(col), altura(row), grupo de gráficos compatível com a proporção, extras
    const item = (type, c, r, chartGroup=null, ex={}) => {
      const base = {
        id: uid(), type, span:{col:c, row:r}, cardStyle: rnd(CARD_STYLES), gradient: rnd(GRADIENTS),
        titleStyle: rnd(TITLE_STYLES), anim: 'anim-fade',
        agg: rnd(['sum','sum','sum','avg','count']), style: 1 + Math.floor(Math.random()*4)
      };
      if (type === 'kpi') { base.labelCol = pickCat(); base.valCol = pickNum(); }
      else if (type === 'chart') {
        base.chartType = chartGroup ? pickChart(chartGroup) : 'bar';
        base.labelCol = ['line','area'].includes(base.chartType) ? pickDate() : pickCat();
        base.valCol = pickNum();
      } else if (type === 'map') { base.labelCol = pickGeo(); base.valCol = pickNum(); base.chartType = 'hbar'; }
      else if (type === 'table') { base.columns = pickTableCols(); }
      return { ...base, ...ex };
    };

    // Biblioteca ampliada de layouts (todos somam exatamente 72 células de 12x6)
    const layoutPool = [
      { name: 'VISÃO EXECUTIVA', build: () => [
        item('kpi',3,1), item('kpi',3,1), item('kpi',3,1), item('kpi',3,1),
        item('chart',8,3,WIDE), item('chart',4,3,CIRCULAR),
        item('table',12,2)
      ]},
      { name: 'OPERAÇÕES GEOSPATIAIS', build: () => [
        item('map',8,4),
        item('kpi',4,2), item('kpi',4,2),
        item('kpi',4,2), item('chart',8,2,['line','area'])
      ]},
      { name: 'MATRIZ DE DESEMPENHO', build: () => [
        item('kpi',2,2), item('chart',8,2,['area','line']), item('kpi',2,2),
        item('chart',4,2,FLEX), item('chart',4,2,['radar']), item('chart',4,2,CIRCULAR),
        item('table',12,2)
      ]},
      { name: 'LOGÍSTICA MISTA', build: () => [
        item('kpi',3,2), item('kpi',3,2), item('kpi',3,2), item('kpi',3,2),
        item('chart',4,2,FLEX), item('chart',4,2,CIRCULAR), item('chart',4,2,['line','area']),
        item('chart',6,2,['treemap']), item('chart',6,2,['heatmap'])
      ]},
      { name: 'ANÁLISE AVANÇADA', build: () => [
        item('chart',6,3,['heatmap']), item('chart',6,3,['treemap']),
        item('chart',12,3,['area','line'])
      ]},
      { name: 'PAINEL COMPACTO', build: () => [ // KPI(2x2)*6=24. Chart(6x2)*2=24. Chart(12x2)=24. Total=72
        item('kpi',2,2), item('kpi',2,2), item('kpi',2,2), item('kpi',2,2), item('kpi',2,2), item('kpi',2,2),
        item('chart',6,2,FLEX), item('chart',6,2,CIRCULAR),
        item('chart',12,2,['line','area'])
      ]},
      { name: 'FOCO EM TENDÊNCIA', build: () => [ // Chart(12x3)=36 + KPI(3x1)*4=12 + Chart(6x2)*2=24 = 72
        item('chart',12,3,['line','area']),
        item('kpi',3,1), item('kpi',3,1), item('kpi',3,1), item('kpi',3,1),
        item('chart',6,2,FLEX), item('chart',6,2,CIRCULAR)
      ]},
      { name: 'RANKING & DISTRIBUIÇÃO', build: () => [ // Chart(6x4)*2=48 + KPI(3x2)*4=24 = 72
        item('chart',6,4,['hbar']), item('chart',6,4,CIRCULAR),
        item('kpi',3,2), item('kpi',3,2), item('kpi',3,2), item('kpi',3,2)
      ]},
      { name: 'GRID SIMÉTRICO', build: () => [ // Chart(4x2)*6=48 + KPI(4x2)*3=24 = 72
        item('chart',4,2,FLEX), item('chart',4,2,CIRCULAR), item('chart',4,2,['line','area']),
        item('chart',4,2,['radar']), item('chart',4,2,['treemap']), item('chart',4,2,['heatmap']),
        item('kpi',4,2), item('kpi',4,2), item('kpi',4,2)
      ]},
      { name: 'DESTAQUE CENTRAL', build: () => [ // Chart(6x4)=24 + KPI(6x1)*4=24 + Table(12x2)=24 = 72
        item('chart',6,4,WIDE),
        item('kpi',6,1), item('kpi',6,1), item('kpi',6,1), item('kpi',6,1),
        item('table',12,2)
      ]}
    ];

    // Sorteia um layout diferente a cada geração (evita repetir o último usado nesta aba)
    const lastKey = `__lastLayout_${tabIdx}`;
    let pick;
    do { pick = rnd(layoutPool); } while (layoutPool.length > 1 && pick.name === DataProfiler[lastKey]);
    DataProfiler[lastKey] = pick.name;

    return { layout: pick.name, items: pick.build() };
  }
};

/* ---------------- Motor de Agregação Seguro ---------------- */
function aggregateData(dataset, labelCol, valCol, chartType, aggMethod = 'sum') {
  const agg = {};
  
  // Detecção de tipo de Y para evitar somar texto
  let isTextVal = true;
  for(let i=0; i<Math.min(20, dataset.length); i++) {
    const v = dataset[i][valCol];
    if(v !== null && v !== undefined && String(v).trim() !== '') {
      if(typeof v === 'number' || !isNaN(cleanNumberVal(v))) { isTextVal = false; break; }
    }
  }

  const isDateLabel = dataset.length > 0 && dataset[0][labelCol] instanceof Date;

  dataset.forEach(row => {
    let k = row[labelCol];
    if (k instanceof Date) k = k.toISOString().split('T')[0]; 
    else if (k === null || k === undefined || String(k).trim() === '') k = '(Vazio)'; 
    else k = String(k).trim();
    
    if (!agg[k]) agg[k] = { sum: 0, count: 0, min: Infinity, max: -Infinity };
    
    if(isTextVal) {
      if(row[valCol] !== null && row[valCol] !== undefined && String(row[valCol]).trim() !== '') agg[k].count += 1;
    } else {
      const n = cleanNumberVal(row[valCol]);
      agg[k].sum += n; agg[k].count += 1;
      if(n < agg[k].min) agg[k].min = n;
      if(n > agg[k].max) agg[k].max = n;
    }
  });

  let entries = Object.entries(agg).map(([k, v]) => {
    let finalVal = 0;
    // Força contagem se a coluna for texto
    if (isTextVal || aggMethod === 'count') finalVal = v.count;
    else if (aggMethod === 'avg') finalVal = v.count > 0 ? (v.sum / v.count) : 0;
    else if (aggMethod === 'min') finalVal = v.min === Infinity ? 0 : v.min;
    else if (aggMethod === 'max') finalVal = v.max === -Infinity ? 0 : v.max;
    else finalVal = v.sum;
    return [k, finalVal];
  });
  
  // Ordena eixo temporal vs Ranking de Valores
  const isTrend = ['line', 'area'].includes(chartType);
  if (isDateLabel || isTrend) entries.sort((a, b) => a[0].localeCompare(b[0])); 
  else entries.sort((a, b) => b[1] - a[1]);

  entries = entries.slice(0, 35); // Limite de barras visual para não quebrar a tela
  
  return { 
    labels: entries.map(e => e[0].substring(0, 25)), 
    values: entries.map(e => {
      let v = Number(e[1].toFixed(2));
      // Protege os gráficos circulares contra números negativos
      return ['pie','doughnut','radar','treemap','funnel'].includes(chartType) ? Math.abs(v) : v;
    }) 
  };
}

/* ---------------- Render ECharts ---------------- */
function renderEChart(config, container) {
  const chart = echarts.init(container, null, { renderer: 'canvas' });
  chart.clear(); 
  
  const theme = currentThemeObj || THEMES[currentThemeIndex];
  const data = aggregateData(globalDataset, config.labelCol, config.valCol, config.chartType, config.agg);
  
  const textColor = '#cfd0d4'; const gridColor = 'rgba(255,255,255,.05)';
  const grad = config.gradient;
  
  const option = {
    backgroundColor: 'transparent', textStyle: { fontFamily: 'Fira Code' },
    tooltip: { backgroundColor: 'rgba(0,0,0,0.9)', borderColor: theme.acc1, borderWidth: 1, textStyle: { color: '#fff', fontSize: 10 } },
    color: [grad[0], grad[1], theme.acc1, theme.acc2, theme.acc3, theme.good, theme.warn, theme.bad]
  };
  
  if (!data.labels.length) {
    option.title = { text: "Sem dados compatíveis para este tipo", textStyle: {color: textColor, fontSize: 10}, left: 'center', top: 'center'};
    chart.setOption(option); return chart;
  }

  const commonX = { type: 'category', data: data.labels, axisLabel: { color: textColor, fontSize: 9 }, axisLine: {lineStyle:{color:gridColor}} };
  const commonY = { type: 'value', axisLabel: { color: textColor, fontSize: 9, formatter: formatCompact }, splitLine:{lineStyle:{color:gridColor}} };
  const itemStyleGrad = { color: new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:grad[0]},{offset:1,color:grad[1]+'22'}]) };

  let type = config.chartType;
  if(type === 'hbar') type = 'bar';

  switch(type){
    case 'bar':
      option.grid = { top: 30, bottom: 30, left: config.chartType==='hbar'?60:40, right: 10 };
      if(config.chartType === 'hbar') {
        option.xAxis = commonY; option.yAxis = commonX;
      } else {
        option.xAxis = commonX; option.yAxis = commonY;
      }
      option.series = [{ type: 'bar', data: data.values, itemStyle: itemStyleGrad, barMaxWidth: 40 }];
      break;
    case 'line': case 'area':
      option.grid = { top: 30, bottom: 30, left: 40, right: 10 };
      option.xAxis = commonX; option.yAxis = commonY;
      option.series = [{ type: 'line', data: data.values, smooth: true, itemStyle: {color: grad[0]}, lineStyle:{width: 3}, areaStyle: type==='area' ? {opacity: 0.3, color: itemStyleGrad.color} : undefined }];
      break;
    case 'pie': case 'doughnut':
      option.series = [{ type: 'pie', radius: type==='doughnut'?['40%','70%']:'70%', center:['50%','50%'], data: data.labels.map((n,i)=>({name:n, value:data.values[i]})), label: {color:textColor, fontSize:9}, itemStyle:{borderColor:theme.panel, borderWidth:2} }];
      break;
    case 'radar':
      option.radar = { indicator: data.labels.map(l=>({name:l, max:Math.max(...data.values)*1.1})), axisName:{color:textColor, fontSize:9}, splitLine:{lineStyle:{color:gridColor}}, splitArea:{show:false} };
      option.series = [{ type: 'radar', data: [{value: data.values, name: config.valCol, itemStyle:{color:grad[0]}, areaStyle:{color:grad[0]+'55'}}] }];
      break;
    case 'treemap':
      option.series = [{ type: 'treemap', data: data.labels.map((n,i)=>({name:n, value:data.values[i]})), label:{color:'#fff', fontSize:10}, itemStyle:{borderColor:theme.panel, borderWidth:2} }];
      break;
    case 'heatmap':
      option.grid = { top: 30, bottom: 30, left: 40, right: 10 };
      option.xAxis = {type:'category', data:data.labels, axisLabel:{color:textColor, fontSize:9}};
      option.yAxis = {type:'category', data:['Val'], axisLabel:{show:false}};
      option.visualMap = { show:false, min:Math.min(...data.values), max:Math.max(...data.values), inRange:{color:[grad[1], grad[0]]} };
      option.series = [{ type:'heatmap', data:data.labels.map((l,i)=>[i,0,data.values[i]]) }];
      break;
    case 'funnel':
      option.series = [{ type: 'funnel', data: data.labels.map((n,i)=>({name:n, value:data.values[i]})), label:{color:'#fff', fontSize:9} }];
      break;
    default:
      option.xAxis = commonX; option.yAxis = commonY;
      option.series = [{ type: 'bar', data: data.values, itemStyle: itemStyleGrad }];
  }
  
  chart.setOption(option, true);
  return chart;
}

/* ---------------- Update Chart Card Isoled ---------------- */
function updateChartCard(cfg, wrap) {
  if (cfg.type === 'kpi' || cfg.type === 'table') {
      buildDynamicUI(globalBlueprints[activeTabId], globalDataset); // KPIs e Tables recriam tudo
  } else {
      const container = wrap.querySelector('.echart-container');
      if (container) {
          if(chartInstances[cfg.id]) { chartInstances[cfg.id].dispose(); }
          chartInstances[cfg.id] = renderEChart(cfg, container);
      }
  }
}

/* ---------------- Render Builder Principal ---------------- */
function buildDynamicUI(blueprint, dataset) {
  if(!blueprint || !blueprint.items) return;
  const grid = $('#dynamic-grid');
  
  Object.values(chartInstances).forEach(c => c.dispose());
  chartInstances = {}; grid.innerHTML = '';
  
  if($('#stat-records')) $('#stat-records').innerText = dataset.length.toLocaleString();
  if($('#stat-layout')) $('#stat-layout').innerText = blueprint.layout;
  
  const controlsHTML = $('#tpl-card-controls').innerHTML;

  blueprint.items.forEach((cfg) => {
    const wrap = document.createElement('div');
    wrap.className = `card ${cfg.cardStyle} ${cfg.anim} col-span-${cfg.span.col} row-span-${cfg.span.row}`;
    wrap.style.setProperty('--gradient', gradCss(cfg.gradient));
    wrap.style.setProperty('--gradient-solid', cfg.gradient[0]);
    
    // Injeta os controles flutuantes estilo Power BI
    const ctrlDiv = document.createElement('div');
    ctrlDiv.innerHTML = controlsHTML;
    const controlsBar = ctrlDiv.firstElementChild;
    wrap.appendChild(controlsBar);

    // Popula opções dinamicamente
    const tSel = controlsBar.querySelector('.ctrl-type');
    CHART_TYPES.forEach(t => tSel.add(new Option(t.label, t.id)));
    tSel.value = cfg.chartType || 'bar';

    const aSel = controlsBar.querySelector('.ctrl-agg');
    [{id:'sum',n:'Soma'},{id:'avg',n:'Média'},{id:'count',n:'Contar'},{id:'max',n:'Máx'},{id:'min',n:'Mín'}].forEach(a => aSel.add(new Option(a.n, a.id)));
    aSel.value = cfg.agg || 'sum';

    const lSel = controlsBar.querySelector('.ctrl-label');
    const vSel = controlsBar.querySelector('.ctrl-val');
    globalProfile.all.forEach(c => {
      lSel.add(new Option(c.substring(0,15), c));
      vSel.add(new Option(c.substring(0,15), c));
    });
    lSel.value = cfg.labelCol; vSel.value = cfg.valCol;

    // Listener para Hot Reload do Card
    controlsBar.querySelectorAll('select').forEach(sel => {
      sel.addEventListener('change', (e) => {
        if(sel.classList.contains('ctrl-type')) cfg.chartType = e.target.value;
        if(sel.classList.contains('ctrl-agg')) cfg.agg = e.target.value;
        if(sel.classList.contains('ctrl-label')) cfg.labelCol = e.target.value;
        if(sel.classList.contains('ctrl-val')) cfg.valCol = e.target.value;
        
        updateChartCard(cfg, wrap);
      });
    });

    const inner = document.createElement('div');
    inner.className = 'card-inner flex flex-col items-center justify-center text-center';

    // Gradientes decorativos
    wrap.insertAdjacentHTML('afterbegin', `<div class="grad-glow"></div><div class="grad-bar"></div>`);

    if(cfg.type === 'kpi') {
      const data = aggregateData(dataset, cfg.labelCol, cfg.valCol, 'bar', cfg.agg);
      const total = data.values.reduce((a,b)=>a+b, 0);
      const valText = formatCompact(total);
      const title = String(cfg.valCol).substring(0,20);
      const icon = getSmartIcon(cfg.valCol);
      const color = isCritical(cfg.valCol) ? 'var(--bad-color)' : (isGood(cfg.valCol) ? 'var(--good-color)' : cfg.gradient[0]);
      const aggTag = ({sum:'TOTAL', avg:'MÉDIA', count:'CONTAGEM', min:'MÍNIMO', max:'MÁXIMO'})[cfg.agg] || 'TOTAL';
      const variant = cfg.style % 4;

      if (variant === 0) {
        // Título em cima + ícone flutuante à direita
        inner.innerHTML = `
          <div class="w-full flex justify-between items-center mb-auto"><span class="${cfg.titleStyle} truncate text-left w-full mr-2">${title}</span><i class="fa-solid ${icon} opacity-50" style="color:${color}"></i></div>
          <div class="kpi-value grad-text w-full mt-2">${valText}</div>
          <span class="text-[8px] tracking-widest opacity-40 mt-1">${aggTag}</span>
        `;
      } else if (variant === 1) {
        // Ícone em bloco à esquerda, valor centralizado
        inner.innerHTML = `
          <div class="flex items-center justify-center gap-3 w-full">
            <div class="w-12 h-12 rounded-xl flex items-center justify-center shrink-0" style="background:var(--gradient)"><i class="fa-solid ${icon} text-white text-xl"></i></div>
            <div class="flex-1 min-w-0 flex flex-col items-center justify-center">
              <div class="${cfg.titleStyle} truncate w-full">${title}</div>
              <div class="kpi-value mt-1">${valText}</div>
            </div>
          </div>
        `;
      } else if (variant === 2) {
        // Valor gigante centralizado, título embaixo com barra de destaque
        inner.innerHTML = `
          <div class="w-full h-full flex flex-col items-center justify-center gap-1">
            <i class="fa-solid ${icon} text-2xl mb-1 opacity-70" style="color:${color}"></i>
            <div class="kpi-value grad-text">${valText}</div>
            <div class="${cfg.titleStyle} truncate max-w-full mt-1">${title}</div>
            <div class="w-8 h-[3px] rounded-full mt-1" style="background:var(--gradient)"></div>
          </div>
        `;
      } else {
        // Estilo "ficha": barra lateral de cor + conteúdo alinhado à esquerda
        inner.innerHTML = `
          <div class="w-full h-full flex items-stretch gap-3">
            <div class="w-[4px] rounded-full shrink-0" style="background:var(--gradient)"></div>
            <div class="flex-1 min-w-0 flex flex-col justify-center">
              <span class="${cfg.titleStyle} truncate w-full block">${title}</span>
              <div class="kpi-value w-full mt-1">${valText}</div>
              <span class="text-[8px] tracking-widest opacity-40 mt-1 flex items-center gap-1"><i class="fa-solid ${icon}"></i> ${aggTag}</span>
            </div>
          </div>
        `;
      }
    } else if(cfg.type === 'table') {
      const cols = cfg.columns;
      inner.innerHTML = `
        <div class="w-full flex justify-between items-center mb-2"><span class="${cfg.titleStyle}">Tabela de Dados</span></div>
        <div class="w-full flex-1 overflow-auto rounded bg-black/40"><table class="log-table">
          <thead><tr>${cols.map(c=>`<th>${String(c).substring(0,15)}</th>`).join('')}</tr></thead>
          <tbody>${dataset.slice(-30).reverse().map(row=>`<tr>${cols.map(c=>`<td>${String(row[c]||'-').substring(0,20)}</td>`).join('')}</tr>`).join('')}</tbody>
        </table></div>`;
    } else {
      inner.innerHTML = `
        <div class="w-full flex justify-between items-center mb-1"><span class="${cfg.titleStyle} truncate w-full text-left">${String(cfg.valCol).substring(0,25)}</span></div>
        <div class="chart-wrapper"><div class="echart-container" id="${cfg.id}"></div></div>`;
    }
    
    wrap.appendChild(inner);
    grid.appendChild(wrap);
  });

  // Renderiza Gráficos após dom update
  setTimeout(() => {
    blueprint.items.forEach(cfg => {
      if(cfg.type === 'chart' || cfg.type === 'map') {
        const el = document.getElementById(cfg.id);
        if(el) chartInstances[cfg.id] = renderEChart(cfg, el);
      }
    });
  }, 100);
}

function rebuildActive() {
  if (globalDataset && globalBlueprints[activeTabId]) {
    buildDynamicUI(globalBlueprints[activeTabId], globalDataset);
  }
}

function renderTabs() {
  const tabBar = $('#tab-navigation');
  tabBar.innerHTML = '';
  const tabNames = ['Overview', 'Operações', 'Performance', 'Logística', 'Avançado'];
  globalBlueprints.forEach((bp, idx) => {
      const btn = document.createElement('button');
      btn.className = 'tab-btn px-2 py-1 text-[10px] font-bold uppercase tracking-widest text-[#888] hover:text-white ' + (idx === activeTabId ? 'active' : '');
      btn.innerText = tabNames[idx] || ('View ' + (idx+1));
      btn.onclick = () => { activeTabId = idx; renderTabs(); rebuildActive(); };
      tabBar.appendChild(btn);
  });
}

$('#btn-regenerate').addEventListener('click', () => {
  if(!globalDataset) return;
  // Sempre um novo layout, novas colunas de dados, novo tema e novo fundo: nunca a mesma experiência duas vezes
  globalBlueprints[activeTabId] = DataProfiler.generateBlueprint(globalProfile, activeTabId);
  pickRandomTheme();
  pickRandomBg();
  rebuildActive();
});

$('#btn-theme').addEventListener('click', pickRandomTheme);
$('#btn-bg').addEventListener('click', pickRandomBg);
$('#btn-upload').addEventListener('click', () => $('#file-upload').click());
$('#btn-upload-initial').addEventListener('click', () => $('#file-upload').click());

window.addEventListener('resize', () => Object.values(chartInstances).forEach(c => c.resize()));

/* ---------------- File Upload ---------------- */
$('#file-upload').addEventListener('change', (e) => {
  const file = e.target.files[0]; if(!file) return;
  $('#loading-overlay').style.display = 'flex';
  $('#btn-upload-initial').style.display = 'none';
  $('#overlay-subtext').innerText = 'Processando Matriz de Dados...';
  
  setTimeout(() => {
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const wb = XLSX.read(new Uint8Array(evt.target.result), {type:'array', cellDates:true});
        globalDataset = DataProfiler.extractBestDataset(wb);
        if(!globalDataset.length) throw new Error("Planilha Vazia");
        
        globalProfile = DataProfiler.profileColumns(globalDataset);
        globalBlueprints = [0,1,2,3,4].map(i => DataProfiler.generateBlueprint(globalProfile, i));
        
        $('#tab-navigation').style.display = 'flex';
        $('#dynamic-grid').style.display = 'grid';
        activeTabId = 0;
        
        renderTabs();
        pickRandomTheme();
        pickRandomBg();
        rebuildActive();
        setTimeout(() => $('#loading-overlay').style.display = 'none', 500);
      } catch(err) {
        alert("Erro no arquivo: " + err.message);
        $('#loading-overlay').style.display = 'none';
      }
    };
    reader.readAsArrayBuffer(file);
  }, 100);
});

// Init Default
applyTheme(0); applyBg(0);
</script>
</body>
</html>
