<!DOCTYPE html>
<html lang="pt-br" class="h-full antialiased">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kyro Suite - Master Edition (Raw Data Engine)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Playfair Display', 'serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #d4d4d8; }
    .dark ::-webkit-scrollbar-thumb { background: #3f3f46; }

    .dark .tab-active { border-bottom: 2px solid white; color: white; }

      #printable-area, #printable-area * { visibility: visible; }

</head>

<body class="flex flex-col h-screen overflow-hidden bg-white dark:bg-[#0a0a0a] text-zinc-800 dark:text-zinc-300 font-sans">

  <div id="toast-container" class="fixed bottom-4 right-4 z-[100] flex flex-col gap-2 pointer-events-none"></div>

  <header class="bg-zinc-50 dark:bg-[#111] border-b border-zinc-200 dark:border-zinc-800 no-print flex-shrink-0 z-30 overflow-x-auto custom-scrollbar">
    <div class="max-w-[1600px] mx-auto px-6 h-14 flex items-center justify-between min-w-[800px]">
      <div class="flex items-center gap-3 pr-8">
        <div class="w-6 h-6 bg-black dark:bg-white text-white dark:text-black flex items-center justify-center font-serif font-bold text-xs">K</div>
        <h1 class="text-xs font-bold tracking-widest uppercase whitespace-nowrap">Kyro Suite <span class="font-normal text-zinc-400">Raw Data Engine</span></h1>
      </div>
      
      <nav class="flex gap-6 h-full items-center flex-1">
        <button onclick="switchTab('tab-gerador')" id="btn-tab-gerador" class="text-[10px] uppercase tracking-widest text-zinc-400 hover:text-black dark:hover:text-white transition-all h-full tab-active whitespace-nowrap">Gerador Automático</button>
        <button onclick="switchTab('tab-db')" id="btn-tab-db" class="text-[10px] uppercase tracking-widest text-zinc-400 hover:text-black dark:hover:text-white transition-all h-full whitespace-nowrap">Banco de Leis (Consulta)</button>
      </nav>

      <div class="flex items-center gap-4 pl-4">
        <button onclick="toggleTheme()" class="text-zinc-500 hover:text-black dark:hover:text-white transition-colors" title="Modo Escuro/Claro"><i class="fa-solid fa-circle-half-stroke"></i></button>
      </div>
    </div>
  </header>

  <main class="flex-1 flex overflow-hidden relative max-w-[1600px] mx-auto w-full">
    
    <section id="tab-gerador" class="flex-1 grid grid-cols-1 lg:grid-cols-2 h-full">
      <div class="flex flex-col border-r border-zinc-200 dark:border-zinc-800 bg-white dark:bg-[#0a0a0a] no-print relative">
        <div class="px-6 py-3 border-b border-zinc-200 dark:border-zinc-800 flex justify-between items-center">
          <span class="text-[9px] font-bold text-zinc-400 uppercase tracking-widest">Fatos do Requerimento</span>
          <button onclick="document.getElementById('input-text').value=''" class="text-[9px] text-zinc-400 hover:text-red-500 uppercase tracking-widest">Limpar Tudo</button>
        </div>
        <textarea id="input-text" class="flex-1 p-6 bg-transparent focus:outline-none font-mono text-sm leading-relaxed text-zinc-800 dark:text-zinc-300 resize-none custom-scrollbar" placeholder="Cole a narrativa do requerimento aqui...&#10;&#10;O motor irá extrair as palavras-chave e buscar a literalidade das leis no Banco de Dados para fundamentar o despacho."></textarea>
        <div class="p-4 border-t border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-[#111]">
          <button onclick="gerarDespachoDinamico()" class="w-full py-4 flex justify-center items-center gap-3 bg-black dark:bg-white text-white dark:text-black text-xs font-bold uppercase tracking-widest hover:bg-zinc-800 dark:hover:bg-zinc-200 transition-all active:scale-[0.99]">

            <div class="flex gap-4">

        </div>

  </main>

  <script>
    // =====================================================================
    // 1. BANCO DE DADOS BRUTO E LITERAL (A FONTE DA VERDADE)
    // O motor vai ler os campos "tags" e, se achar no texto do requerimento, 
    // vai inserir o "textoLiteral" direto no Despacho.
    // Você pode colar milhares de artigos aqui seguindo este mesmo padrão.
    // =====================================================================
    const BaseDeLeis = [
        // LEGISLAÇÃO MUNICIPAL DE LIMEIRA (LO 5.494/2015, LO 1.890/1983, LC 41/1991, LC 442/2009)
        {

            tags: ["limpeza", "limpo", "mato", "roçado", "muro", "calçada", "roçada", "entulho", "lixo"], 
            textoLiteral: "Art. 35. Os proprietários ou possuidores a qualquer título de imóveis não edificados... são obrigados a mantê-los limpos, capinados e isentos de quaisquer materiais inservíveis. § 1º O descumprimento do disposto no caput deste artigo ensejará a notificação do infrator para que providencie a limpeza... § 2º Não atendida a notificação, será lavrado o Auto de Infração e Imposição de Multa. A regularização posterior à lavratura do auto não elide a infração.",
            teseDespacho: "A infração restou perfeitamente caracterizada no momento em que a fiscalização constatou a ausência de manutenção. Pelo princípio do tempus regit actum, a limpeza tardia do imóvel constitui mero cumprimento de dever contínuo inerente à propriedade (obrigação propter rem) e não extingue a multa aplicada com fulcro no supracitado Art. 35 da LO 5.494/2015."
        },
        { 
            diploma: "Lei Ordinária nº 1.890/1983 (CTM Limeira)", 
            artigo: "Art. 7º", 
            categoria: "Sujeição Passiva IPTU",
            tags: ["vendi", "vendeu", "contrato de compra", "gaveta", "nome do antigo", "ilegitimidade passiva"], 
            textoLiteral: "Art. 7º. Contribuinte do imposto é o proprietário do imóvel, o titular do seu domínio útil, ou o seu possuidor a qualquer título. Parágrafo Único. Respondem solidariamente pelo pagamento do imposto o justo possuidor, o titular do direito de usufruto, uso ou habitação, os promitentes compradores imitidos na posse, os cessionários, os posseiros, os comodatários e os ocupantes a qualquer título do imóvel, ainda que pertencente a qualquer pessoa física ou jurídica, de direito público ou privado, isenta do imposto ou a ele imune.",
            teseDespacho: "Como se depreende da letra da lei municipal (CTM), em consonância com a Súmula 399 do STJ e o Art. 1.245 do Código Civil (que exige o registro imobiliário para transferência de propriedade), os contratos de gaveta não são oponíveis à Fazenda Pública. A municipalidade tem a faculdade de cobrar o IPTU do proprietário tabular constante no Cartório de Imóveis."
        },
        { 
            diploma: "Lei Complementar nº 41/1991 (Limeira)", 
            artigo: "Normas Gerais de Dívida Ativa", 
            categoria: "Dívida Ativa",
            tags: ["dívida ativa", "inscrição", "certidão"], 
            textoLiteral: "Constitui Dívida Ativa do Município a proveniente de crédito dessa natureza, regularmente inscrita na repartição administrativa competente, depois de esgotado o prazo fixado, para pagamento, pela lei ou por decisão final proferida em processo regular.",
            teseDespacho: "O crédito sub examine encontra-se regularmente inscrito em Dívida Ativa, gozando, portanto, de liquidez, certeza e exigibilidade (presunção juris tantum), cabendo ao administrado o ônus da prova inequívoca em contrário."
        },

        // CÓDIGO TRIBUTÁRIO NACIONAL - CTN (L5172COMPILADO)
        { 
            diploma: "Lei nº 5.172/1966 (CTN)", 
            artigo: "Art. 111", 
            categoria: "Interpretação e Isenção",
            tags: ["isenção", "aposentado", "doença", "câncer", "pensionista", "isento", "isentar"], 
            textoLiteral: "Art. 111. Interpreta-se literalmente a legislação tributária que disponha sobre: I - suspensão ou exclusão do crédito tributário; II - outorga de isenção; III - dispensa do cumprimento de obrigações tributárias acessórias.",
            teseDespacho: "Sendo a isenção uma modalidade de renúncia de receita que excepciona a regra geral de tributação, o rigor do Art. 111 do CTN exige a comprovação cabal, por parte do contribuinte, de todos os requisitos taxativos impostos pela lei municipal isentiva, não admitindo interpretação analógica ou extensiva."
        },
        { 
            diploma: "Lei nº 5.172/1966 (CTN)", 
            artigo: "Art. 123", 
            categoria: "Convenções Particulares",
            tags: ["contrato", "gaveta", "acordo particular", "ele que tem que pagar", "combinamos"], 
            textoLiteral: "Art. 123. Salvo disposições de lei em contrário, as convenções particulares, relativas à responsabilidade pelo pagamento de tributos, não podem ser opostas à Fazenda Pública, para modificar a definição legal do sujeito passivo das obrigações tributárias correspondentes.",
            teseDespacho: "O contrato firmado entre particulares não altera a sujeição passiva tributária. O Município não integra a relação de direito privado estabelecida entre as partes."
        },
        { 
            diploma: "Lei nº 5.172/1966 (CTN)", 
            artigo: "Art. 149", 
            categoria: "Revisão de Lançamento",
            tags: ["erro", "área construída", "metragem errada", "cobrança indevida", "revisão", "duplicidade"], 
            textoLiteral: "Art. 149. O lançamento é efetuado e revisto de ofício pela autoridade administrativa nos seguintes casos: [...] IV - quando se comprove falsidade, erro ou omissão quanto a qualquer elemento definido na legislação tributária; VIII - quando deva ser apreciado fato não conhecido ou não provado por ocasião do lançamento anterior.",
            teseDespacho: "O poder-dever de autotutela da Administração e o princípio da verdade material autorizam e determinam a revisão do lançamento tributário sempre que for constatado erro de fato nos cadastros imobiliários ou físicos (BIC), procedendo-se à respectiva retificação."
        },
        { 
            diploma: "Lei nº 5.172/1966 (CTN)", 
            artigo: "Art. 156", 
            categoria: "Extinção do Crédito",
            tags: ["extinção", "pagamento", "compensação"], 
            textoLiteral: "Art. 156. Extinguem o crédito tributário: I - o pagamento; II - a compensação; III - a transação; IV - remissão; V - a prescrição e a decadência; VI - a conversão de depósito em renda...",
            teseDespacho: "A baixa sistêmica só é autorizada mediante a ocorrência taxativa de um dos eventos elencados no artigo supramencionado."
        },
        { 
            diploma: "Lei nº 5.172/1966 (CTN)",

            tags: ["decadência", "decaiu", "lançamento retroativo", "não lançou na época"],

            teseDespacho: "Constatado o transcurso do lapso temporal superior a cinco anos sem o efetivo lançamento e notificação válida ao contribuinte, opera-se a decadência (perda do direito material de lançar)."
        },
        { 
            diploma: "Lei nº 5.172/1966 (CTN)", 
            artigo: "Art. 174", 
            categoria: "Prescrição Tributária",
            tags: ["prescrição", "prescrito", "cinco anos", "5 anos", "não cobrou", "caducou a dívida"], 
            textoLiteral: "Art. 174. A ação para a cobrança do crédito tributário prescreve em cinco anos, contados da data da sua constituição definitiva. Parágrafo único. A prescrição se interrompe: I - pelo despacho do juiz que ordenar a citação em execução fiscal; II - pelo protesto judicial; III - por qualquer ato judicial que constitua em mora o devedor; IV - por qualquer ato inequívoco ainda que extrajudicial, que importe em reconhecimento do débito pelo devedor.",
            teseDespacho: "Transcorridos mais de 5 (cinco) anos desde a constituição definitiva do crédito sem a ocorrência de quaisquer marcos interruptivos delineados no parágrafo único do art. 174, resta fulminada a exigibilidade do crédito em decorrência da prescrição."
        },

        // JURISPRUDÊNCIA / SÚMULAS PACIFICADAS
        { 
            diploma: "Superior Tribunal de Justiça (STJ)", 
            artigo: "Súmula 399", 
            categoria: "Jurisprudência - IPTU",
            tags: ["dono", "proprietário", "possuidor", "nome de outro"], 
            textoLiteral: "Súmula 399 - Cabe à legislação municipal estabelecer o sujeito passivo do IPTU, podendo ser o proprietário do imóvel ou o seu possuidor a qualquer título.",
            teseDespacho: "Jurisprudência pacificada corrobora a legitimidade das Fazendas Municipais em promover a cobrança em face daquele que detém o domínio tabular."
        },
        { 
            diploma: "Supremo Tribunal Federal (STF)", 
            artigo: "Súmula Vinculante 19", 
            categoria: "Jurisprudência - Taxas",
            tags: ["taxa de lixo", "coleta de lixo", "tcl", "lixo"], 
            textoLiteral: "Súmula Vinculante 19 - A taxa cobrada exclusivamente em razão dos serviços públicos de coleta, remoção e tratamento de lixo não viola o artigo 145, II, da Constituição Federal.",
            teseDespacho: "A taxa detém base constitucional por configurar serviço público específico e divisível de utilidade pública."
        }
    ];

    // =====================================================================
    // 2. FUNÇÕES DE EXTRAÇÃO AUTOMÁTICA DE DADOS (REGEX)
    // =====================================================================
    function extrairDados(texto) {
        const cpf = texto.match(/\b\d{3}\.\d{3}\.\d{3}-\d{2}\b/g) || [];
        const cnpj = texto.match(/\b\d{2}\.\d{3}\.\d{3}\/\d{4}-\d{2}\b/g) || [];
        const inscricoes = texto.match(/\b\d{5}\b|\b\d{4,5}\.\d{3}\.\d{3}\b/g) || []; 
        const processos = texto.match(/\b\d{4,5}\/\d{4}\b/g) || [];
        const notacoes = texto.match(/(notificação|auto de infração) (nº|n°)? ?\d+\/\d+/gi) || [];
        
        let nome = "NÃO IDENTIFICADO";
        const nomeMatch = texto.match(/(?:contribuinte|requerente|senhor|senhora|dona|seu)\s+([A-Z][a-z]+(?:\s+[A-Z][a-z]+)+)/i);
        if (nomeMatch) nome = nomeMatch[1];

        return {
            cpfCnpj: [...cpf, ...cnpj].join(', ') || 'NÃO INFORMADO',
            inscricao: inscricoes.join(', ') || 'NÃO INFORMADA',
            processos: [...processos, ...notacoes].join(', ') || 'NÃO INFORMADOS',
            nome: nome.toUpperCase()
        };
    }

    // =====================================================================
    // 3. MOTOR DE GERAÇÃO DINÂMICA
    // Ele cruza o texto do usuário com a BaseDeLeis, puxa a literalidade
    // e constrói um despacho altamente embasado.
    // =====================================================================
    function gerarDespachoDinamico() {
        const text = document.getElementById("input-text").value.trim();
        if (!text) { 
            showToast("⚠️ O requerimento está vazio. Insira os dados do caso."); 
            return; 
        }

        const dados = extrairDados(text);
        const txtUpper = text.toUpperCase();
        
        // 1. Cruzamento de Dados (Acha as leis aplicáveis)
        let leisAplicaveis = [];
        BaseDeLeis.forEach(lei => {
            let matches = lei.tags.some(tag => txtUpper.includes(tag.toUpperCase()));
            if (matches) leisAplicaveis.push(lei);
        });

        // 2. Monta o corpo do despacho com a letra da lei
        let natureza = "DESPACHO TÉCNICO DE ENCAMINHAMENTO";
        let fundamentacao = "Legislação Municipal / CTN";
        let parecer = "Analisando os fatos narrados, e na ausência de elementos conclusivos primários, verifica-se a necessidade de diligência fiscal ou verificação junto aos sistemas.\n\nDetermino o encaminhamento ao setor técnico competente para levantamento de relatórios pertinentes.";
        let deferimento = "Encaminhe-se para averiguação.";

        if (leisAplicaveis.length > 0) {
            // Pega a lei principal (a primeira que deu match) para ser o Título
            natureza = "DESPACHO TÉCNICO E FUNDAMENTAÇÃO LEGAL";
            fundamentacao = leisAplicaveis.map(l => `${l.diploma} - ${l.artigo}`).join(";\n");
            
            parecer = "Em sede de análise ao requerimento epigrafado, cumpre trazer à colação a estrita disposição da legislação de regência aplicável ao caso fático narrado pelo contribuinte:\n\n";
            
            leisAplicaveis.forEach(lei => {
                parecer += `"${lei.textoLiteral}"\n`;
                parecer += `${lei.teseDespacho}\n\n`;
            });

            // Lógica de deferimento baseada nas tags principais
            if (txtUpper.includes("PRESCRIÇÃO") || txtUpper.includes("DECADÊNCIA") || txtUpper.includes("ERRO")) {
                deferimento = "Ante ao estritamente exposto pelas disposições legais supracitadas, opino pelo DEFERIMENTO do pleito, cabendo à autoridade competente a baixa/revisão dos lançamentos.";
            } else if (txtUpper.includes("LIMPEZA") || txtUpper.includes("GAVETA") || txtUpper.includes("VENDI")) {
                deferimento = "Por força da normatização exposta e presunção de legitimidade dos atos da Administração Pública, opino pelo INDEFERIMENTO do pedido, não merecendo acolhida a tese exordial.";
            } else {
                deferimento = "Determino o prosseguimento do feito com base na legislação vinculada, devendo o setor subsequente proceder com as movimentações sistêmicas necessárias.";
            }
        }

        const resultado = 
`PROCESSO / REF: ${dados.processos}
REQUERENTE: ${dados.nome}
CPF/CNPJ: ${dados.cpfCnpj}
INSCRIÇÃO: ${dados.inscricao}

NATUREZA: ${natureza}
DATA: ${new Date().toLocaleDateString('pt-BR')}

I. RELATÓRIO
Trata-se de requerimento onde o contribuinte em epígrafe pugna pela análise da municipalidade sob a seguinte premissa e alegação:
"${text.substring(0, 300)}${text.length > 300 ? ' [...]' : ''}"

II. LETRA DA LEI E PARECER TÉCNICO
Dispositivos Legais extraídos da Base de Dados aplicáveis à espécie: 
${fundamentacao}

${parecer}

III. CONCLUSÃO
${deferimento}

À consideração superior.

___________________________________________________
Setor de Dívida Ativa / Posturas - Limeira (SP)
Documento gerado e embasado automaticamente via Kyro Suite`;

        document.getElementById('output-text').innerText = resultado;
        document.getElementById('print-content').innerHTML = resultado.replace(/\n/g, '<br>');
        document.getElementById('placeholder').classList.add('hidden');
        document.getElementById('output-header').classList.remove('hidden');
        showToast(`✅ Despacho gerado! ${leisAplicaveis.length} leis cruzadas e aplicadas.`);
    }

    // =====================================================================
    // 4. INTERFACE E CONTROLES DE ABAS
    // =====================================================================
    function switchTab(tabId) {
        ['tab-gerador', 'tab-db'].forEach(id => {
            document.getElementById(id).classList.add('hidden');
            document.getElementById('btn-' + id).classList.remove('tab-active');
        });
        document.getElementById(tabId).classList.remove('hidden');
        document.getElementById('btn-' + tabId).classList.add('tab-active');
    }

    function renderConsultas() {
        // Renderiza o Banco de Leis Literal
        document.getElementById('list-db').innerHTML = BaseDeLeis.map(lei => `
            <div class="item-legal p-5 border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-black shadow-sm mb-4">
                <div class="flex justify-between items-center mb-4 border-b border-zinc-100 dark:border-zinc-900 pb-2">
                    <div>
                        <span class="font-bold text-black dark:text-white font-sans text-sm block">${lei.diploma}</span>
                        <span class="text-xs text-brand-600 dark:text-brand-400 font-bold">${lei.artigo}</span>
                    </div>
                    <span class="text-[9px] uppercase tracking-widest bg-zinc-200 dark:bg-zinc-800 px-3 py-1 text-black dark:text-white font-bold rounded-sm">${lei.categoria}</span>
                </div>
                <div class="bg-zinc-50 dark:bg-zinc-900/50 p-4 border-l-4 border-black dark:border-white mb-3">
                    <p class="text-zinc-800 dark:text-zinc-200 text-sm font-serif leading-relaxed italic">"${lei.textoLiteral}"</p>
                </div>
                <p class="text-[10px] uppercase font-mono text-zinc-500">Gatilhos do Motor: ${lei.tags.join(', ')}</p>
            </div>
        `).join('');
    }

    function filterDB() {
        const query = document.getElementById('search-db').value.toLowerCase();
        document.querySelectorAll('#list-db .item-legal').forEach(el => {
            el.style.display = el.innerText.toLowerCase().includes(query) ? 'block' : 'none';
        });
    }

    function showToast(msg) {
        const t = document.createElement('div');
        t.className = "bg-black dark:bg-white text-white dark:text-black text-[10px] uppercase tracking-widest px-4 py-3 shadow-2xl font-bold transition-all";
        t.innerText = msg;
        document.getElementById('toast-container').appendChild(t);
        setTimeout(() => t.remove(), 4000);
    }

    function copyToClipboard() {
        navigator.clipboard.writeText(document.getElementById('output-text').innerText);
        showToast("📋 Texto copiado para a área de transferência");
    }

    function exportToWord() {
        const content = document.getElementById('output-text').innerText;
        if(!content) return;
        const sourceHTML = "<html xmlns:w='urn:schemas-microsoft-com:office:word'><body>" + content.replace(/\n/g, "<br>") + "</body></html>";
        const fileDownload = document.createElement("a");
        fileDownload.href = 'data:application/vnd.ms-word;charset=utf-8,' + encodeURIComponent(sourceHTML);
        fileDownload.download = 'Despacho_Kyro_Raw_Data.doc';
        fileDownload.click();
    }

    function toggleTheme() {
        document.documentElement.classList.toggle('dark');
    }

    window.onload = () => { renderConsultas(); };
  </script>
</body>
</html>
